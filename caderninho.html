          ${done.map((b) => `
            <button type="button" class="row" data-action="bill:open" data-id="${esc(b.id)}">
              <span class="row-ico ${b.kind === 'receive' ? 'in' : 'out'}" aria-hidden="true">${I('check')}</span>
              <span class="row-main"><b>${esc(b.title)}</b><small>${b.kind === 'receive' ? 'Recebida' : 'Paga'} em ${U.formatDate(b.paidAt)}</small></span>
              <span class="amount ${b.kind === 'receive' ? 'in' : 'out'}">${$money(b.amount)}</span>
            </button>`).join('')}
        </section>` : ''}`;
  }

  /* ---------- Ações ---------- */
  C.Actions['bill:filter'] = (el) => { bl.filter = el.dataset.filter; C.App.render(); };

  C.Actions['bill:settle'] = (el) => {
    const b = Store.getBill(el.dataset.id);
    if (!b || b.status !== 'open') return;
    Game.lastGain = 0;
    const res = Store.settleBill(b.id);
    if (!res) return;
    const xp = Game.lastGain ? ` +${Game.lastGain} XP` : '';
    const nextTxt = res.next ? ` Próxima: ${U.formatDate(res.next.dueDate)}.` : '';
    UI.toast(`${b.kind === 'receive' ? 'Recebido!' : 'Conta paga!'}${xp}${nextTxt}`, 'success', { action: { label: 'Desfazer', run: () => { Store.reopenBill(b.id); UI.toast('Voltou para as contas abertas', 'info'); } } });
  };

  C.Actions['bill:open'] = (el) => {
    const b = Store.getBill(el.dataset.id);
    if (!b) return;
    if (b.status === 'open') { C.Forms.openBillForm({ bill: b }); return; }
    UI.openSheet({
      title: esc(b.title),
      html: `
        <p>${b.kind === 'receive' ? 'Recebida' : 'Paga'} em <b>${U.formatDate(b.paidAt)}</b> · ${$money(b.amount)}</p>
        ${UI.help('<b>Desfazer</b> devolve a conta para as abertas e remove a anotação criada ao dar baixa. <b>Excluir</b> apaga só a conta; a anotação do dinheiro continua.')}
        <div class="actions">
          <button type="button" class="btn danger-ghost" data-del>Excluir</button>
          <button type="button" class="btn primary grow" data-undo>Desfazer</button>
        </div>`,
      onMount(body, sheet) {
        body.querySelector('[data-undo]').addEventListener('click', () => { Store.reopenBill(b.id); UI.toast('Voltou para as contas abertas', 'info'); sheet.close(); });
        body.querySelector('[data-del]').addEventListener('click', () => {
          const old = Store.deleteBill(b.id);
          sheet.close();
          if (old) UI.toast('Conta excluída', 'info', { action: { label: 'Desfazer', run: () => Store.restore('bill', old) } });
        });
      },
    });
  };

  function chargeMessage(b) {
    const n = U.diffDays(U.today(), b.dueDate);
    const hi = b.person ? `Olá, ${U.firstName(b.person)}! Tudo bem?` : 'Olá! Tudo bem?';
    const base = `Passando para lembrar do pagamento de "${b.title}", no valor de ${U.formatMoney(b.amount)}`;
    if (n < 0) return `${hi} ${base}, que venceu no dia ${U.formatDate(b.dueDate)}. Consegue me confirmar quando puder pagar? Obrigado!`;
    return `${hi} ${base}, com vencimento em ${U.formatDate(b.dueDate)}. Qualquer dúvida é só me chamar. Obrigado!`;
  }
  /** Mensagem da cobrança + (se a pessoa cadastrou a chave) o Pix copia e cola. Se o Pix falhar, a cobrança vai sem ele. */
  function chargeText(b) {
    let msg = chargeMessage(b);
    let pix = null;
    try { pix = C.Pix.forBill(b, { qr: false }); } catch (e) { pix = null; }
    if (pix) msg += `\n\nPara pagar por Pix, copie o código abaixo e cole no app do seu banco (Pix copia e cola):\n${pix.code}`;
    return msg.replace(/ /g, ' ');
  }

  function openWhatsApp(phone, text) {
    const url = `https://wa.me/${phone || ''}?text=${encodeURIComponent(text)}`;
    // Atenção: com 'noopener' o navegador SEMPRE devolve null; por isso abrimos sem ele e soltamos o vínculo depois.
    let w = null;
    try { w = global.open(url, '_blank'); } catch (e) { w = null; }
    if (w) { try { w.opener = null; } catch (e) { /* ignore */ } return true; }
    // pop-up bloqueado: avisa e oferece o link, sem tirar a pessoa do app
    UI.toast('O navegador bloqueou a nova janela.', 'error', { action: { label: 'Abrir WhatsApp', run: () => { global.location.href = url; } } });
    return false;
  }

  /** Sheet com QR + copia e cola (usado pela conta e pelo Pix rápido). */
  function showPixSheet(pix, o) {
    UI.openSheet({
      title: o.title || 'Cobrar por Pix',
      html: `
        <div class="pix-box">
          <div class="qr-wrap">${pix.svg}</div>
          <p class="pix-amount">${U.formatMoney(o.amount)}</p>
          <p class="hint">${esc(o.subtitle || '')}</p>
          <p class="verified">${I('shield')} Código conferido pelo app</p>
        </div>
        <div class="pix-steps">
          <div><b class="n">1</b><span>O cliente abre o app do banco e escolhe <b>Pix</b>.</span></div>
          <div><b class="n">2</b><span><b>Ler QR Code</b> (aponta a câmera) ou <b>Pix copia e cola</b> (cola o código abaixo).</span></div>
          <div><b class="n">3</b><span>Ele confere o <b>nome</b> <b>${esc(pix.data.name)}</b> e confirma.</span></div>
        </div>
        ${UI.help('Quando o dinheiro <b>cair na sua conta</b>, volte e toque em <b>Recebi</b>. O app não consegue saber sozinho se o cliente pagou.', { tone: 'warn', force: true })}
        <label class="field"><span>Pix copia e cola</span><textarea class="pix-code" readonly rows="4" aria-label="Código Pix copia e cola">${esc(pix.code)}</textarea></label>
        <div class="actions">
          <button type="button" class="btn primary grow" data-copy>${I('copy')} Copiar código</button>
          <button type="button" class="btn wa grow" data-wa>${I('message')} WhatsApp</button>
        </div>`,
      onMount(body, sheet) {
        const ta = body.querySelector('textarea');
        ta.addEventListener('focus', () => ta.select());
        body.querySelector('[data-copy]').addEventListener('click', async () => {
          const ok = await C.Pix.copyText(pix.code);
          if (!ok) { ta.focus(); ta.select(); }
          UI.toast(ok ? 'Código copiado' : 'Não consegui copiar. O código está selecionado: segure e toque em Copiar.', ok ? 'success' : 'error');
        });
        body.querySelector('[data-wa]').addEventListener('click', () => { if (o.onWhatsApp) o.onWhatsApp(sheet); });
      },
    });
  }

  function needPixSheet() {
    UI.openSheet({
      title: 'Cobrar por Pix',
      html: `${UI.help('Para gerar o QR Code e o Pix copia e cola, cadastre primeiro a sua chave Pix, o nome e a cidade. É rápido e só precisa fazer uma vez.', { title: 'Falta a sua chave', force: true })}
        <div class="actions"><button type="button" class="btn primary grow" data-setup>${I('qr')} Cadastrar minha chave</button></div>`,
      onMount(body, sheet) { body.querySelector('[data-setup]').addEventListener('click', () => { sheet.close(); setTimeout(() => C.Forms.openPixForm(), 30); }); },
    });
  }

  C.Actions['pix:show'] = (el) => {
    const b = Store.getBill(el.dataset.id);
    if (!b) return;
    if (!C.Pix.getConfig()) { needPixSheet(); return; }
    let pix;
    try { pix = C.Pix.forBill(b); } catch (e) { UI.toast(e.message || 'Não consegui criar o Pix', 'error'); return; }
    if (!pix) { UI.toast('Esse Pix só funciona em contas a receber.', 'info'); return; }
    showPixSheet(pix, {
      amount: b.amount, subtitle: b.title + (b.person ? ' · ' + b.person : ''),
      onWhatsApp(sheet) { sheet.close(); C.Actions['bill:charge']({ dataset: { id: b.id } }); },
    });
  };

  C.Actions['pix:quick'] = () => {
    if (!C.Pix.getConfig()) { needPixSheet(); return; }
    UI.openSheet({
      title: 'Pix rápido',
      html: `
        <form class="form" autocomplete="off" novalidate>
          ${UI.help('Gera um QR Code e um copia e cola com o valor que você digitar, sem precisar cadastrar uma conta. Bom para vendas na hora.', { title: 'Cobrar na hora' })}
          <label class="field"><span>Quanto vai cobrar?</span><div class="money-input"><b>R$</b><input name="amount" inputmode="numeric" placeholder="0,00" aria-label="Valor"></div></label>
          <div class="actions"><button type="submit" class="btn primary grow">${I('qr')} Gerar Pix</button></div>
        </form>`,
      onMount(body, sheet) {
        const form = body.querySelector('form');
        UI.bindMoney(form.elements.amount);
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const amount = U.parseMoney(form.elements.amount.value);
          if (amount <= 0) { UI.toast('Digite o valor a cobrar', 'error'); form.elements.amount.focus(); return; }
          let pix;
          try { pix = C.Pix.quick({ amountCents: amount }); } catch (err) { UI.toast(err.message || 'Não consegui criar o Pix', 'error'); return; }
          sheet.close();
          setTimeout(() => showPixSheet(pix, {
            amount, subtitle: 'Pix rápido',
            onWhatsApp() { openWhatsApp('', `Segue o Pix de ${U.formatMoney(amount)}. Copie o código abaixo e cole no app do seu banco (Pix copia e cola):\n${pix.code}`); },
          }), 40);
        });
      },
    });
  };

  C.Actions['bill:charge'] = (el) => {
    const b = Store.getBill(el.dataset.id);
    if (!b) return;
    if (!b.phone) { UI.toast('Adicione o WhatsApp do cliente para cobrar', 'info'); C.Forms.openBillForm({ bill: b }); return; }
    const phone = U.normalizePhoneBR(b.phone);
    if (!phone) { UI.toast('Esse número de WhatsApp parece errado. Confira com o DDD.', 'error'); C.Forms.openBillForm({ bill: b }); return; }
    if (!openWhatsApp(phone, chargeText(b))) return;
    Game.lastGain = 0;
    Store.markChargeSent(b.id);
    UI.toast(Game.lastGain ? `Cobrança pronta! +${Game.lastGain} XP` : 'Cobrança pronta!', 'success');
  };

  C.Views.contas = { render: billsRender, chargeMessage, chargeText };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 11-views-b.js ===== */
/* ==========================================================================
   Telas: Resumo (#/resumo), Metas (#/metas), Perfil (#/perfil)
   ========================================================================== */
(function (global) {
  'use strict';

  const C = (global.Caderninho = global.Caderninho || {});
  const U = C.Utils;
  const Store = C.Store;
  const Game = C.Game;
  const UI = C.UI;
  const esc = U.escapeHTML;
  const I = C.Icons.svg;
  const $money = UI.money;
  const VERSION = '4.0.0';

  /* ======================================================================
     RESUMO
     ====================================================================== */
  const sm = { month: null };

  function summaryRender() {
    const s = Store.get();
    const nowKey = U.monthKey(U.today());
    const mk = sm.month || (sm.month = nowKey);
    const r = U.monthRange(mk);
    const list = Store.txInRange(r.from, r.to);
    const t = Store.totals(list);
    const prevKey = U.shiftMonth(mk, -1);
    const pr = U.monthRange(prevKey);
    // mês em andamento: compara com o MESMO trecho do mês passado (dia 1 até hoje), não com o mês inteiro
    const upTo = mk === nowKey ? Math.min(Number(U.today().slice(8)), Number(pr.to.slice(8))) : Number(pr.to.slice(8));
    const pt = Store.totals(Store.txInRange(pr.from, `${prevKey}-${U.pad(upTo)}`));

    // últimos 6 meses
    const months = [];
    for (let i = -5; i <= 0; i++) { const k = U.shiftMonth(mk, i); const rr = U.monthRange(k); months.push({ k, t: Store.totals(Store.txInRange(rr.from, rr.to)) }); }
    const maxV = Math.max(1, ...months.map((m) => Math.max(m.t.in, m.t.out)));

    // categorias de gasto
    const cats = new Map();
    list.filter((x) => x.type === 'out' && x.category !== 'meta').forEach((x) => cats.set(x.category, (cats.get(x.category) || 0) + x.amount));
    const catList = Array.from(cats.entries()).map(([id, v]) => ({ id, v, info: Store.categoryInfo('out', id) })).sort((a, b) => b.v - a.v);

    let insight = '';
    if (pt.out > 0 && t.out > 0) {
      const diff = Math.round(((t.out - pt.out) / pt.out) * 100);
      if (diff === 0) insight = `Seus gastos estão iguais aos de ${U.monthName(prevKey)}.`;
      else insight = diff < 0 ? `Você gastou <b>${-diff}% a menos</b> do que em ${U.monthName(prevKey)}. Muito bem!` : `Você gastou <b>${diff}% a mais</b> do que em ${U.monthName(prevKey)}.`;
    }
    const savingsRate = t.in > 0 ? Math.round(((t.in - t.out) / t.in) * 100) : null;
    const lvl = Game.levelFor(s.game.xp);
    const got = Game.ACHIEVEMENTS.filter((a) => s.game.achievements[a.id]).length;

    return `
      <div>
        <h1 class="page-title">Seu resumo</h1>
        <p class="page-sub">Para onde foi o seu dinheiro.</p>
      </div>
      ${UI.help('Veja o mês escolhido: quanto <b>entrou</b>, quanto <b>saiu</b> e em que você mais gastou. O gráfico compara os últimos 6 meses. O que você <b>guarda em metas</b> não entra como gasto.', { title: 'Para que serve esta tela' })}
      <div class="month-nav">
        <button type="button" class="icon-btn" data-action="sum:month" data-n="-1" aria-label="Mês anterior">${I('chevron-left')}</button>
        <b>${U.monthLabelFull(mk)}</b>
        <button type="button" class="icon-btn" data-action="sum:month" data-n="1" aria-label="Próximo mês" ${mk >= nowKey ? 'disabled style="opacity:.4"' : ''}>${I('chevron-right')}</button>
      </div>

      <section class="card balance" aria-label="Resumo do mês">
        <p class="eyebrow">Sobrou</p>
        <p class="big ${t.net < 0 ? 'neg' : ''}">${$money(t.net)}</p>
        <div class="split"><div><small>Entrou</small><b>${$money(t.in)}</b></div><div><small>Saiu</small><b>${$money(t.out)}</b></div></div>
        ${t.saved > 0 ? `<p class="saved-note">${I('target')} Guardado em metas: ${$money(t.saved)}</p>` : ''}
        ${savingsRate !== null ? `<p class="saved-note">${I('trending-up')} Você ficou com ${savingsRate}% do que ganhou</p>` : ''}
      </section>
      ${insight ? UI.help(insight, { tone: 'ok', title: 'Comparando com o mês passado' }) : ''}

      <section class="card">
        <div class="card-title"><h2>${I('chart')} Últimos 6 meses</h2></div>
        <div class="bars" role="img" aria-label="Gráfico de entradas e saídas dos últimos 6 meses">
          ${months.map((m) => `
            <div class="col ${m.k === mk ? 'now' : ''}">
              <div class="pair"><i class="i" style="height:${Math.max(2, (m.t.in / maxV) * 100)}%" title="Entrou ${U.formatMoney(m.t.in)}"></i><i class="o" style="height:${Math.max(2, (m.t.out / maxV) * 100)}%" title="Saiu ${U.formatMoney(m.t.out)}"></i></div>
              <small>${U.monthShort(m.k)}</small>
            </div>`).join('')}
        </div>
        <div class="legend"><span><i style="background:var(--green)"></i>Entrou</span><span><i style="background:var(--gold)"></i>Saiu</span></div>
      </section>

      <section class="card">
        <div class="card-title"><h2>${I('pie')} Em que você gastou</h2></div>
        ${catList.length ? catList.map((c) => `
          <div class="cat-row">
            <div class="top"><span>${I(c.info.icon)} ${esc(c.info.label)}</span><span class="num">${$money(c.v)} · ${Math.round((c.v / t.out) * 100)}%</span></div>
            ${UI.progressBar(c.v / t.out)}
          </div>`).join('') : UI.emptyState('pie', 'Sem gastos neste mês', 'Quando você anotar saídas, elas aparecem aqui por categoria.')}
        ${catList.length ? UI.help('As barras mostram a parte de cada categoria no total que saiu. Comece cortando o que for maior e menos importante.', { tone: 'tip' }) : ''}
      </section>

      <section class="card">
        <div class="card-title"><h2>${I('trophy')} Conquistas</h2><small class="muted">${got}/${Game.ACHIEVEMENTS.length} · Nível ${lvl.level}</small></div>
        <div class="ach-grid">
          ${Game.ACHIEVEMENTS.map((a) => { const on = !!s.game.achievements[a.id]; return `<div class="ach ${on ? '' : 'locked'}">${I(on ? a.icon : 'lock')}<b>${esc(a.title)}</b><small>${esc(a.desc)}</small></div>`; }).join('')}
        </div>
        ${UI.help('Cada conquista vale <b>30 XP</b>. As cinzas ainda estão trancadas: leia a descrição de cada uma para saber como liberar.', { tone: 'tip' })}
      </section>

      <div class="two-up">
        <a class="btn ghost" href="#/metas">${I('target')} Minhas metas</a>
        <button type="button" class="btn ghost" data-action="data:csv-month" data-month="${mk}">${I('download')} Baixar o mês</button>
      </div>`;
  }
  C.Actions['sum:month'] = (el) => {
    const now = U.monthKey(U.today());
    const next = U.shiftMonth(sm.month || now, Number(el.dataset.n));
    if (next > now) return;
    sm.month = next; C.App.render();
  };
  C.Views.resumo = { render: summaryRender };

  /* ======================================================================
     METAS
     ====================================================================== */
  function goalCard(g) {
    const done = !!g.doneAt;
    const missing = Math.max(0, g.target - g.saved);
    const pct = Math.min(100, Math.floor((g.saved / g.target) * 100));
    return `
      <article class="card goal">
        <div class="goal-head"><b>${I(done ? 'trophy' : 'target')} ${esc(g.title)}</b><span class="muted">${pct}%</span></div>
        ${UI.progressBar(g.saved / g.target, 'green')}
        <div class="goal-meta"><span>${$money(g.saved)} guardados</span><span>${done ? 'Meta batida!' : `faltam ${$money(missing)}`}</span></div>
        <div class="actions">
          <button type="button" class="btn danger-ghost small" data-action="goal:delete" data-id="${esc(g.id)}" aria-label="Excluir meta ${esc(g.title)}">Excluir</button>
          ${done ? '' : `<button type="button" class="btn primary small grow" data-action="goal:deposit" data-id="${esc(g.id)}">${I('plus')} Guardar dinheiro</button>`}
        </div>
      </article>`;
  }
  function goalsRender() {
    const goals = Store.get().goals.slice().sort((a, b) => (a.doneAt ? 1 : 0) - (b.doneAt ? 1 : 0) || b.createdAt - a.createdAt);
    return `
      <div>
        <h1 class="page-title">Suas metas</h1>
        <p class="page-sub">Guardar aos poucos também é vencer.</p>
      </div>
      ${UI.help('<b>Meta</b> é um sonho com valor, como uma reserva, uma viagem ou um celular novo. Crie a meta e, sempre que separar um dinheirinho, toque em <b>Guardar dinheiro</b>. A barra mostra quanto já juntou e quanto falta. O valor guardado não conta como gasto.', { title: 'Como funcionam as metas' })}
      <button type="button" class="btn primary block" data-action="goal:new">${I('plus')} Nova meta</button>
      ${goals.length ? goals.map(goalCard).join('') : `<section class="card">${UI.emptyState('target', 'Nenhuma meta ainda', 'Crie uma meta (reserva, viagem, celular novo…) e acompanhe o quanto já juntou.')}</section>`}`;
  }
  C.Actions['goal:delete'] = async (el) => {
    const g = Store.getGoal(el.dataset.id);
    if (!g) return;
    const yes = await UI.confirmDialog({ title: 'Excluir meta?', message: `A meta "${g.title}" será apagada. O dinheiro já anotado continua nas suas anotações.`, okLabel: 'Excluir', danger: true });
    if (!yes) return;
    const old = Store.deleteGoal(g.id);
    if (old) UI.toast('Meta excluída', 'info', { action: { label: 'Desfazer', run: () => Store.restore('goal', old) } });
  };
  C.Views.metas = { render: goalsRender };

  /* ======================================================================
     PERFIL
     ====================================================================== */
  const row = (icon, title, sub, right, attrs) => `
    <div class="settings-row">${I(icon)}<div class="grow"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>${right || ''}</div>`;
  const sw = (id, on) => `<input type="checkbox" class="switch" role="switch" data-change="pref:${id}" ${on ? 'checked' : ''} aria-label="${id}">`;
  const act = (a, label, cls, extra) => `<button type="button" class="btn small ${cls || 'ghost'}" data-action="${a}" ${extra || ''}>${label}</button>`;

  function ago(ms) {
    if (!ms) return 'nunca';
    const d = U.diffDays(U.toISO(new Date(ms)), U.today());
    return d <= 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${d} dias`;
  }

  function profileRender() {
    const s = Store.get();
    const p = s.profile;
    const lvl = Game.levelFor(s.game.xp);
    const st = Store.status;
    const pix = C.Pix.getConfig();
    const cfgOk = C.Sync && C.Sync.isConfigured();
    const sync = cfgOk ? C.Sync.status() : null;
    const counts = `${s.transactions.length} anotações · ${s.bills.length} contas · ${s.goals.length} metas`;
    const safety = Store.safetyInfo();
    const canInstall = !!global.__cadInstall;

    return `
      <div>
        <h1 class="page-title">Seu perfil</h1>
        <p class="page-sub">Ajustes, Pix e cópia de segurança.</p>
      </div>

      <section class="card">
        <div class="streak-line">
          <span class="avatar" style="width:3.2rem;height:3.2rem;font-size:1.3rem">${p.name ? esc(p.name.trim().charAt(0).toUpperCase()) : I('user')}</span>
          <div style="flex:1"><b>${p.name ? esc(p.name) : 'Sem nome'}</b><p>Nível ${lvl.level} · ${esc(lvl.title)} · ${s.game.xp} XP</p></div>
          ${act('name:edit', 'Mudar')}
        </div>
        ${UI.progressBar(lvl.progress)}
      </section>

      <h2 class="section-title">${I('qr')} Receber por Pix</h2>
      <section class="card">
        ${pix ? `
          ${row('key', 'Chave cadastrada', `${esc(C.Pix.KEY_TYPES.find((k) => k.id === pix.type).label)}: ${esc(C.Pix.maskKey(pix.type, pix.key))}<br>${esc(C.Pix.clean(pix.name, 25))} · ${esc(C.Pix.clean(pix.city, 15))}`)}

(function (global) {

    }

  /* ---------- Cabeçalho ---------- */
  function paintChrome(route) {
    const s = Store.get();

      }

  function bindEvents() {

  /* ---------- Som de abertura ("tim") ---------- */
  let audioCtx = null, timPlayed = false;
  function playTim(force) {
    if (timPlayed) return;
    const st = Store.get();
    if (st && st.profile && st.profile.muteSound) { timPlayed = true; return; }
    try {
      const AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return;

  }

      document.head.appendChild(link);
    } catch (e) { /* opcional */ }
  }

  function init() {
    const splash = runSplash();
    Store.load();
    Game.init();
    Game.evaluate({ silent: true });
    applyPrefs();
    bindEvents();
    installManifest();
    render();
    if (C.Sync) C.Sync.init();
    // a boas-vindas só abre depois da animação (senão o teclado aparece por baixo dela)
    if (!Store.get().profile.welcomed) splash.then(() => { if (!Store.get().profile.welcomed) C.Forms.openNameForm({ welcome: true }); });
  }

  C.App = { init, render, currentRoute, playTim };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
document.addEventListener('DOMContentLoaded', function () { if (window.Caderninho && Caderninho.Icons) Caderninho.Icons.hydrate(document); });
</script>
