<style>
/* ==========================================================================
   Caderninho — estilos. Todo tamanho em rem (escala automática pela tela).
   Cores nas variáveis de :root. Modo escuro automático (ou escolhido no Perfil).
   ========================================================================== */
:root {
  --green: #1f7a4d; --green-d: #165c39; --green-soft: #e3f2ea;
  --gold: #f2b632; --gold-soft: #fdf1d3; --gold-d: #8a5d00;
  --red: #c4372f; --red-soft: #fbe7e5;
  --blue: #1f5fa8; --blue-soft: #e3eefb;
  --wa: #1fa855;
  --paper: #fffdf6; --paper-2: #f4f0e3; --card: #ffffff; --ink: #1d2a24; --ink-2: #55635b; --line: #e6e0cf;
  --shadow-sm: 0 1px 2px rgba(29,42,36,.06); --shadow: 0 6px 20px rgba(29,42,36,.12); --shadow-lg: 0 18px 50px rgba(29,42,36,.25);
  --radius: 1.1rem; --radius-sm: .75rem;
  --fs-title: 1.7rem; --fs-big: 2.5rem; --fs-h2: 1.08rem; --fs-body: 1rem; --fs-small: .84rem; --fs-tiny: .75rem;
  --tap: 2.9rem; --tabbar-h: 4.4rem; --on-green: #fff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --green: #3fb27a; --green-d: #7fdcae; --green-soft: #173528; --gold-soft: #3a2f10; --gold-d: #f2c75a;
    --red: #ff7d74; --red-soft: #3d1d1b; --blue: #7db4f0; --blue-soft: #172a42;
    --paper: #121a16; --paper-2: #1b2620; --card: #19231e; --ink: #eaf1ec; --ink-2: #a2b2a8; --line: #2b3a32;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 6px 20px rgba(0,0,0,.45); --shadow-lg: 0 18px 50px rgba(0,0,0,.6);
    --on-green: #07210f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --green: #3fb27a; --green-d: #7fdcae; --green-soft: #173528; --gold-soft: #3a2f10; --gold-d: #f2c75a;
  --red: #ff7d74; --red-soft: #3d1d1b; --blue: #7db4f0; --blue-soft: #172a42;
  --paper: #121a16; --paper-2: #1b2620; --card: #19231e; --ink: #eaf1ec; --ink-2: #a2b2a8; --line: #2b3a32;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4); --shadow: 0 6px 20px rgba(0,0,0,.45); --shadow-lg: 0 18px 50px rgba(0,0,0,.6);
  --on-green: #07210f; color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: clamp(13.5px, 3.85vw, 16.5px); -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink); min-height: 100vh; min-height: 100dvh;
  font: var(--fs-body)/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body.sheet-open { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.ic { width: 1.15em; height: 1.15em; flex: none; vertical-align: -.2em; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: .4rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.neg { color: var(--red); } .pos { color: var(--green); }
.num { font-variant-numeric: tabular-nums; }
body.hide-values .money { filter: blur(.45rem); user-select: none; }

/* ---------- Estrutura ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: .6rem;
  padding: calc(.55rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) .55rem max(1rem, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 800; letter-spacing: -.02em; font-size: 1.12rem; text-decoration: none; margin-right: auto; }
.brand img { width: 2rem; height: 2rem; border-radius: .5rem; display: block; }
.chip { display: inline-flex; align-items: center; gap: .3rem; min-height: 2.2rem; padding: .25rem .65rem; border-radius: 999px; background: var(--gold-soft); color: var(--gold-d); font-weight: 800; border: 0; text-decoration: none; }
.chip.off { background: var(--paper-2); color: var(--ink-2); }
.chip-net { display: inline-flex; align-items: center; gap: .3rem; padding: .3rem .6rem; border-radius: 999px; font-size: var(--fs-small); font-weight: 700; white-space: nowrap; border: 0; }
.chip-net.off { background: var(--gold-soft); color: var(--gold-d); }
.chip-net.busy { background: var(--blue-soft); color: var(--blue); }
.chip-net.busy .ic { animation: spin 1s linear infinite; }
.chip-net.err { background: var(--red-soft); color: var(--red); }
@keyframes spin { to { transform: rotate(360deg); } }
.avatar { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--green); color: var(--on-green); font-weight: 800; display: grid; place-items: center; border: 0; text-decoration: none; }
.avatar .ic { width: 1.2rem; height: 1.2rem; }

main#view {
  max-width: 34rem; margin: 0 auto; display: grid; gap: .95rem; align-content: start;
  padding: 1rem max(1rem, env(safe-area-inset-right)) calc(var(--tabbar-h) + 2.2rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  animation: rise .25s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }

.tabbar {
  position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; height: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.06);
}
.tabbar-inner { display: contents; }
.tabbar a.tab { display: grid; justify-items: center; gap: .15rem; text-decoration: none; color: var(--ink-2); font-size: var(--fs-tiny); font-weight: 700; padding: .35rem 0; min-height: 3.3rem; align-content: center; }
.tabbar a.tab .ic { width: 1.55rem; height: 1.55rem; }
.tabbar a.tab.active { color: var(--green); }
.tabbar a.tab.active .ic { stroke-width: 2.4; }
.fab {
  position: fixed; z-index: 41; right: max(1rem, env(safe-area-inset-right)); bottom: calc(var(--tabbar-h) + 1rem + env(safe-area-inset-bottom));
  width: 3.7rem; height: 3.7rem; border-radius: 50%; border: 0; background: var(--gold); color: #3a2800;
  display: grid; place-items: center; box-shadow: 0 8px 22px rgba(0,0,0,.28);
}
.fab .ic { width: 1.8rem; height: 1.8rem; stroke-width: 2.8; }
.fab:active { transform: scale(.94); }
@media (min-width: 700px) { .fab { right: calc(50% - 17rem + 1rem); } }
@media (min-width: 700px) { .tabbar { left: 50%; right: auto; width: 34rem; transform: translateX(-50%); border-radius: 1.2rem 1.2rem 0 0; border: 1px solid var(--line); border-bottom: 0; } }

.page-title { font-size: var(--fs-title); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.page-sub { color: var(--ink-2); margin-top: .2rem; }
.section-title { font-size: var(--fs-h2); font-weight: 800; display: flex; align-items: center; gap: .4rem; margin-top: .3rem; }

/* ---------- Cartões e listas ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow-sm); display: grid; gap: .7rem; }
.card-title { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.card-title h2 { font-size: var(--fs-h2); font-weight: 800; display: flex; align-items: center; gap: .4rem; }
.link { color: var(--green); font-weight: 700; background: none; border: 0; padding: .3rem 0; text-decoration: none; font-size: var(--fs-small); }
.link:hover { text-decoration: underline; }
.hint { font-size: var(--fs-small); color: var(--ink-2); }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 0; }
.list { display: grid; }
.row {
  display: flex; align-items: center; gap: .75rem; padding: .7rem 0; width: 100%; min-height: 3.4rem; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
}
.list > .row:last-child, .row:last-child { border-bottom: 0; }
.row-ico { width: 2.5rem; height: 2.5rem; border-radius: .8rem; display: grid; place-items: center; background: var(--paper-2); color: var(--ink-2); flex: none; }
.row-ico.in { background: var(--green-soft); color: var(--green); }
.row-ico.out { background: var(--red-soft); color: var(--red); }
.row-ico.late { background: var(--red-soft); color: var(--red); }
.row-ico.meta { background: var(--blue-soft); color: var(--blue); }
.row-main { display: grid; min-width: 0; flex: 1; }
.row-main b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main small { color: var(--ink-2); font-size: var(--fs-small); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-main small.late { color: var(--red); font-weight: 700; }
.amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amount.in { color: var(--green); } .amount.out { color: var(--ink); } .amount.meta { color: var(--blue); }
.tag { display: inline-block; font-size: var(--fs-tiny); font-weight: 700; background: var(--blue-soft); color: var(--blue); padding: .05rem .45rem; border-radius: 999px; vertical-align: .1rem; }
.day-head { display: flex; justify-content: space-between; font-size: var(--fs-small); font-weight: 800; color: var(--ink-2); padding: .5rem 0 .1rem; text-transform: capitalize; }

/* ---------- Saldo ---------- */
.balance { background: linear-gradient(160deg, #1f7a4d 0%, #145233 100%); color: #fff; border: 0; position: relative; overflow: hidden; }
.balance::after { content: ""; position: absolute; right: -3rem; top: -3rem; width: 11rem; height: 11rem; border-radius: 50%; background: rgba(255,255,255,.07); }
.balance .eyebrow { font-size: var(--fs-small); opacity: .85; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.balance .big { font-size: var(--fs-big); font-weight: 800; letter-spacing: -.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.balance .big.neg { color: #ffd1cc; }
.balance .split { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.balance .split > div { background: rgba(255,255,255,.12); border-radius: .8rem; padding: .55rem .75rem; display: grid; }
.balance .split small { opacity: .85; font-size: var(--fs-small); }
.balance .split b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.balance .saved-note { font-size: var(--fs-small); opacity: .9; display: flex; gap: .35rem; align-items: center; }
.balance .quick { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; position: relative; z-index: 1; }
.eye-btn { background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; width: 2.2rem; height: 2.2rem; display: grid; place-items: center; position: relative; z-index: 1; }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: var(--tap); padding: .55rem 1.1rem;
  border-radius: .95rem; border: 1.5px solid var(--line); background: var(--card); font-weight: 800; text-decoration: none; transition: transform .08s, filter .15s;
}
.btn:active { transform: scale(.97); }
.btn:disabled, .btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--on-green); }
.btn.ghost { background: transparent; border-color: var(--green); color: var(--green); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn.danger-ghost { background: transparent; border-color: transparent; color: var(--red); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.small { min-height: 2.75rem; padding: .35rem .8rem; font-size: var(--fs-small); border-radius: .8rem; }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.btn.b-in { background: #fff; color: #145233; border-color: #fff; font-size: 1.08rem; min-height: 3.3rem; }
.quick .btn:not(.b-in) { background: rgba(0,0,0,.22); color: #fff; border-color: transparent; font-size: 1.08rem; min-height: 3.3rem; }
.icon-btn { width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 0; background: var(--paper-2); display: grid; place-items: center; }
.two-up { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: .8rem; display: grid; gap: .1rem; box-shadow: var(--shadow-sm); }
.stat small { color: var(--ink-2); font-size: var(--fs-small); }
.stat b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }

/* ---------- Progresso, ajuda ---------- */
.bar { height: .7rem; background: var(--paper-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 999px; transition: width .5s ease; }
.bar.green > i { background: var(--green); } .bar.red > i { background: var(--red); }
.streak-line { display: flex; gap: .8rem; align-items: center; }
.streak-line p { color: var(--ink-2); font-size: var(--fs-small); }
.streak-flame { width: 2.8rem; height: 2.8rem; border-radius: 50%; background: var(--gold-soft); color: var(--gold-d); display: grid; place-items: center; }
.streak-flame .ic { width: 1.5rem; height: 1.5rem; }
.lvl-head { display: flex; justify-content: space-between; align-items: baseline; }
.lvl-head small { color: var(--ink-2); }
.help { display: flex; gap: .55rem; padding: .6rem .75rem; border-radius: var(--radius-sm); background: var(--blue-soft); color: var(--ink); font-size: var(--fs-small); line-height: 1.4; }
.help .ic { color: var(--blue); margin-top: .1rem; }
.help b { font-weight: 800; }
.help .h-title { display: block; font-weight: 800; margin-bottom: .1rem; }
.help.tip { background: var(--gold-soft); } .help.tip .ic { color: var(--gold-d); }
.help.warn { background: var(--red-soft); } .help.warn .ic { color: var(--red); }
.help.ok { background: var(--green-soft); } .help.ok .ic { color: var(--green); }
body.no-help .help:not(.force) { display: none; }
.empty { display: grid; justify-items: center; text-align: center; gap: .4rem; padding: 1rem .5rem; }
.empty > .ic { width: 2.6rem; height: 2.6rem; color: var(--ink-2); opacity: .6; }
.empty b { font-size: 1.05rem; } .empty p { color: var(--ink-2); font-size: var(--fs-small); max-width: 22rem; }
.empty .btn { margin-top: .4rem; }

/* ---------- Filtros / chips / formulários ---------- */
.filters { display: flex; gap: .45rem; overflow-x: auto; padding: .1rem 0 .3rem; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.pill { flex: none; min-height: 2.5rem; padding: .3rem .85rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: var(--fs-small); display: inline-flex; gap: .3rem; align-items: center; }
.pill.active { background: var(--green); border-color: var(--green); color: var(--on-green); }
.search { display: flex; align-items: center; gap: .5rem; background: var(--card); border: 1.5px solid var(--line); border-radius: .95rem; padding: 0 .8rem; min-height: 2.9rem; }
.search input { flex: 1; border: 0; background: transparent; font: inherit; color: inherit; min-height: 2.8rem; min-width: 0; }
.search input:focus { outline: none; }
.search:focus-within { border-color: var(--green); }
.form { display: grid; gap: .85rem; }
.field { display: grid; gap: .3rem; }
.field > span { font-weight: 700; font-size: var(--fs-small); }
.field em { font-style: normal; font-weight: 500; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; min-height: var(--tap); padding: .55rem .85rem; border-radius: .85rem; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); font: inherit; font-size: max(1rem, 16px);
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); outline: none; box-shadow: 0 0 0 3px var(--green-soft); }
.field.bad input { border-color: var(--red); }
.field .err { color: var(--red); font-size: var(--fs-small); font-weight: 600; }
.money-input { display: flex; align-items: center; gap: .5rem; border: 1.5px solid var(--line); border-radius: .95rem; padding: 0 .9rem; background: var(--card); min-height: 3.4rem; }
.money-input:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.money-input b { color: var(--ink-2); font-size: 1.1rem; }
.money-input input { border: 0; background: transparent; font-size: max(1.6rem, 16px); font-weight: 800; padding: 0; min-height: 3.2rem; box-shadow: none !important; flex: 1; min-width: 0; letter-spacing: -.02em; }
.money-input input:focus { outline: none; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--paper-2); border-radius: .95rem; padding: .25rem; gap: .25rem; }
.seg-btn { min-height: 2.7rem; border: 0; background: transparent; border-radius: .75rem; font-weight: 800; display: inline-flex; justify-content: center; align-items: center; gap: .35rem; color: var(--ink-2); }
.seg-btn.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip-b { display: inline-flex; align-items: center; gap: .35rem; min-height: 2.5rem; padding: .25rem .75rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: var(--fs-small); font-weight: 700; }
.chip-b.active { background: var(--green-soft); border-color: var(--green); color: var(--green-d); }
.check { display: flex; align-items: center; gap: .6rem; min-height: var(--tap); font-weight: 600; }
.check input { width: 1.4rem; height: 1.4rem; accent-color: var(--green); }
.actions { display: flex; gap: .6rem; align-items: center; margin-top: .2rem; }
.form-msg { padding: .6rem .8rem; border-radius: var(--radius-sm); font-size: var(--fs-small); line-height: 1.4; background: var(--paper-2); }
.form-msg.ok { background: var(--green-soft); color: var(--green-d); }
.form-msg.bad { background: var(--red-soft); color: var(--red); font-weight: 600; }
.quick-amounts { display: flex; gap: .4rem; flex-wrap: wrap; }

/* ---------- Contas ---------- */
.bill-card { gap: .6rem; }
.bill-top { display: flex; align-items: center; gap: .75rem; background: none; border: 0; padding: 0; text-align: left; width: 100%; min-height: 3rem; }
.bill-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

/* ---------- Metas ---------- */
.goal-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.goal-head b { display: flex; align-items: center; gap: .4rem; }
.goal-meta { display: flex; justify-content: space-between; font-size: var(--fs-small); color: var(--ink-2); gap: .5rem; }

/* ---------- Resumo ---------- */
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.month-nav b { font-size: 1.05rem; text-align: center; flex: 1; }
.bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: .5rem; align-items: end; height: 8.5rem; padding-top: .5rem; }
.bars .col { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: .3rem; justify-items: center; }
.bars .pair { display: flex; gap: 2px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.bars .pair i { display: block; width: 38%; max-width: 1.2rem; border-radius: .3rem .3rem 0 0; min-height: 2px; }
.bars .pair .i { background: var(--green); } .bars .pair .o { background: var(--gold); }
.bars small { font-size: var(--fs-tiny); color: var(--ink-2); text-transform: capitalize; }
.bars .col.now small { color: var(--ink); font-weight: 800; }
.legend { display: flex; gap: 1rem; font-size: var(--fs-small); color: var(--ink-2); }
.legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: .2rem; margin-right: .3rem; }
.cat-row { display: grid; gap: .25rem; }
.cat-row .top { display: flex; justify-content: space-between; gap: .5rem; font-size: var(--fs-small); }
.cat-row .top span { display: inline-flex; gap: .35rem; align-items: center; font-weight: 700; }
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
.ach { display: grid; gap: .15rem; justify-items: center; text-align: center; padding: .75rem .5rem; border-radius: var(--radius-sm); background: var(--gold-soft); border: 1px solid var(--line); }
.ach .ic { width: 1.7rem; height: 1.7rem; color: var(--gold-d); }
.ach b { font-size: var(--fs-small); } .ach small { font-size: var(--fs-tiny); color: var(--ink-2); }
.ach.locked { background: var(--paper-2); opacity: .65; } .ach.locked .ic { color: var(--ink-2); }

/* ---------- Pix ---------- */
.pix-box { display: grid; justify-items: center; gap: .45rem; text-align: center; }
.qr-wrap { width: min(100%, 15.5rem); padding: .55rem; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
.qr-wrap .qr { display: block; width: 100%; height: auto; }
.pix-amount { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pix-code { width: 100%; min-height: 5.5rem; padding: .6rem .75rem; resize: none; border: 1.5px solid var(--line); border-radius: .85rem; background: var(--card); color: var(--ink); font: .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
.pix-steps { display: grid; gap: .4rem; font-size: var(--fs-small); }
.pix-steps div { display: flex; gap: .55rem; align-items: flex-start; }
.pix-steps b.n { flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--green); color: var(--on-green); display: grid; place-items: center; font-size: var(--fs-tiny); }
.verified { display: inline-flex; align-items: center; gap: .35rem; font-size: var(--fs-small); color: var(--green); font-weight: 700; }

/* ---------- Sheet, diálogo, toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(10,20,15,.55); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: 34rem; max-height: 92dvh; max-height: 92vh; background: var(--paper); border-radius: 1.4rem 1.4rem 0 0; display: flex; flex-direction: column;
  animation: slide .25s cubic-bezier(.2,.8,.2,1); box-shadow: var(--shadow-lg);
}
@supports (height: 1dvh) { .sheet { max-height: 92dvh; } }
@keyframes slide { from { transform: translateY(100%); } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .9rem 1rem .6rem 1.2rem; position: relative; }
.sheet-head::before { content: ""; position: absolute; top: .35rem; left: 50%; width: 2.5rem; height: .28rem; border-radius: 99px; background: var(--line); transform: translateX(-50%); }
.sheet-head h2 { font-size: 1.2rem; font-weight: 800; }
.sheet-body { padding: .3rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior: contain; display: grid; gap: .85rem; align-content: start; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 1.4rem; } }
.dialog { background: var(--card); border-radius: 1.3rem; padding: 1.3rem; width: min(92vw, 24rem); display: grid; gap: .8rem; box-shadow: var(--shadow-lg); margin: auto; animation: rise .2s; }
.dialog h2 { font-size: 1.2rem; } .dialog p { color: var(--ink-2); }
.overlay.center { align-items: center; }
.toasts { position: fixed; z-index: 200; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 1.4rem + env(safe-area-inset-bottom)); display: grid; gap: .5rem; width: min(92vw, 26rem); pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); padding: .7rem 1rem; border-radius: .95rem; font-weight: 600; font-size: var(--fs-small); box-shadow: var(--shadow); display: flex; align-items: center; gap: .6rem; animation: rise .2s; pointer-events: auto; }
.toast.success { background: var(--green-d); color: #fff; } .toast.error { background: var(--red); color: #fff; } .toast.gold { background: var(--gold); color: #3a2800; }
:root[data-theme="dark"] .toast.success, :root:not([data-theme="light"]) .toast.success { color: #0c2418; }
.toast button { margin-left: auto; background: rgba(255,255,255,.2); color: inherit; border: 0; border-radius: .6rem; padding: .35rem .7rem; font-weight: 800; min-height: 2.2rem; }
.banner { display: flex; align-items: center; gap: .6rem; padding: .7rem .9rem; border-radius: var(--radius-sm); font-size: var(--fs-small); font-weight: 600; }
.banner.warn { background: var(--gold-soft); color: var(--gold-d); } .banner.bad { background: var(--red-soft); color: var(--red); } .banner.ok { background: var(--green-soft); color: var(--green-d); }
.banner .btn { margin-left: auto; flex: none; }
.settings-row { display: flex; align-items: center; gap: .75rem; padding: .6rem 0; border-bottom: 1px solid var(--line); min-height: 3.2rem; }
.settings-row:last-child { border-bottom: 0; }
.settings-row > .ic { color: var(--ink-2); width: 1.4rem; height: 1.4rem; }
.settings-row .grow { flex: 1; display: grid; min-width: 0; } .settings-row .grow small { color: var(--ink-2); font-size: var(--fs-small); }
.switch { appearance: none; width: 3rem; height: 1.75rem; border-radius: 99px; background: var(--line); position: relative; border: 0; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.35rem; height: 1.35rem; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch:checked { background: var(--green); } .switch:checked::after { transform: translateX(1.25rem); }

/* ---------- Abertura ---------- */
.splash { position: fixed; inset: 0; z-index: 500; background: var(--green); color: #fff; display: grid; place-items: center; align-content: center; gap: 1rem; transition: opacity .45s, visibility .45s; }
.splash.leave { opacity: 0; visibility: hidden; }
.splash svg.logo { width: 9rem; height: 9rem; }
.splash .name { font-size: 2rem; font-weight: 800; letter-spacing: -.03em; opacity: 0; animation: fadeup .6s 1.5s forwards; }
.splash .by { position: absolute; bottom: calc(2rem + env(safe-area-inset-bottom)); font-size: var(--fs-small); opacity: 0; animation: fadeup .6s 2s forwards; letter-spacing: .05em; }
.splash .skip { position: absolute; top: calc(1rem + env(safe-area-inset-top)); right: 1rem; background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 99px; padding: .45rem .9rem; font-weight: 700; font-size: var(--fs-small); }
@keyframes fadeup { from { opacity: 0; transform: translateY(.6rem); } to { opacity: 1; transform: none; } }
.splash .draw { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1s ease-out forwards; }
.splash .d1 { animation-delay: .2s; } .splash .d2 { animation-delay: .5s; } .splash .d3 { animation-delay: .9s; } .splash .d4 { animation-delay: 1.2s; }
.splash .pop { transform-origin: center; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .splash *, main#view, .sheet, .overlay, .toast { animation-duration: .01s !important; animation-delay: 0s !important; } .splash .name, .splash .by { opacity: 1; } .splash .draw { stroke-dashoffset: 0; } }

@media print {
  .app-header, .tabbar, .toasts, .btn, .fab { display: none !important; }
  body { background: #fff; color: #000; }
  main#view { padding: 0; max-width: none; }
  .card { box-shadow: none; break-inside: avoid; }
}

<script>
/* ===== 00-config.js ===== */
/* ==========================================================================
   CONFIG — ÚNICO lugar para ligar a conta/nuvem (opcional).
   Enquanto url e anonKey estiverem vazios, o app funciona 100% neste aparelho.

   Como ligar:
     1) Crie um projeto em supabase.com.
     2) No "SQL Editor", rode o SQL abaixo (cria a tabela com RLS: cada pessoa só enxerga a própria linha).
     3) Em Settings > API, copie "Project URL" e a chave "anon public" para cá.
        (A chave anon é pública por desenho. NUNCA use a service_role.)
     4) Em Authentication, deixe "Confirm email" ligado e coloque o endereço do app em "Site URL".

   --- SQL (rode uma vez) ---
   create table if not exists public.caderninho_data (
     user_id    uuid primary key references auth.users(id) on delete cascade,
     data       jsonb not null,
     version    integer not null default 1,
     updated_at timestamptz not null default now()
   );
   alter table public.caderninho_data enable row level security;
   create policy "le_propria_linha"   on public.caderninho_data for select using (auth.uid() = user_id);
   create policy "cria_propria_linha" on public.caderninho_data for insert with check (auth.uid() = user_id);
   create policy "muda_propria_linha" on public.caderninho_data for update using (auth.uid() = user_id) with check (auth.uid() = user_id);
   create policy "apaga_propria_linha" on public.caderninho_data for delete using (auth.uid() = user_id);
   --- fim do SQL ---
   ========================================================================== */
(function (global) {
  'use strict';
  const C = (global.Caderninho = global.Caderninho || {});
  const defaults = {
    sync: {
      provider: 'supabase',
      url: '',       // ex.: 'https://abcdxyz.supabase.co'  (precisa ser https)
      anonKey: '',   // ex.: 'eyJhbGciOi...'
      table: 'caderninho_data',
    },
  };
  const extra = global.CADERNINHO_CONFIG || {};
  C.Config = { sync: Object.assign({}, defaults.sync, extra.sync || {}) };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===== 01-utils.js ===== */
/* ==========================================================================
   Utils — dinheiro (centavos), datas (ISO local), telefone, texto seguro
   ========================================================================== */
(function (global) {
  'use strict';

  const C = (global.Caderninho = global.Caderninho || {});

    if (g.achievements && typeof g.achievements === 'object') for (const k of Object.keys(g.achievements).slice(0, 100)) out.game.achievements[str(k, 40)] = U.isValidISO(g.achievements[k]) ? g.achievements[k] : U.today();

    const d = g.daily || {};
    out.game.daily = { date: U.isValidISO(d.date) ? d.date : '', count: Math.max(0, posInt(d.count)), deposits: Math.max(0, posInt(d.deposits)) };
    out.game.chargesSent = Math.max(0, posInt(g.chargesSent));
    const p = raw.profile && typeof raw.profile === 'object' ? raw.profile : {};
    out.profile = {
      name: str(p.name, 30), welcomed: !!p.welcomed, pix: cleanPix(p.pix), hideHelp: !!p.hideHelp, muteSound: !!p.muteSound,
      theme: ['auto', 'light', 'dark'].includes(p.theme) ? p.theme : 'auto', hideValues: !!p.hideValues,
      budget: U.clamp(posInt(p.budget), 0, U.MAX_CENTS), lastBackupAt: ts(p.lastBackupAt, 0), updatedAt: ts(p.updatedAt, 0),

  /* ---------- Armazenamento ---------- */
  let state = blank();

  function ls() { try { return global.localStorage || null; } catch (e) { return null; } }

  function persist() {

      safeSet(KEY, json);

      if (hasData && safeGet(snapKey) == null) {

      }
    };

  function tryParse(raw) {
    if (!raw) return null;

  }

  function legacyScan() {
    try {
      const s = ls();
      for (let i = 0; s && i < s.length; i++) {
        const k = s.key(i);
        if (!k || !/^caderninho/i.test(k) || k === KEY || k.startsWith(KEY) || k.startsWith(SNAP) || k.startsWith(CORRUPT) || k === SAFETY || /session|owner|install/i.test(k)) continue;
        const r = tryParse(s.getItem(k));

  }

  function load() {
    const rawMain = safeGet(KEY);

      if (res.dropped > 0) { try { safeSet(CORRUPT + Date.now(), rawMain); } catch (e) { /* ignore */ } }
    } else {
      let found = null;
      if (rawMain) { try { safeSet(CORRUPT + Date.now(), rawMain); } catch (e) { /* ignore */ } }
      const prev = tryParse(safeGet(PREV));
      if (prev) found = { r: prev, label: 'a cópia anterior' };
      if (!found) for (const k of snapKeys()) { const r = tryParse(safeGet(k)); if (r) { found = { r, label: `a cópia de ${U.formatDate(k.slice(SNAP.length))}` }; break; } }
      if (found) { state = found.r.state; if (rawMain) status.recovered = found.label; }
      else if (!rawMain) {
        const leg = legacyScan();
        if (leg) { state = leg.r.state; status.migrated = true; }
      } else if (rawMain) { status.recovered = 'none'; }
    }
    // metadados que dependem de outras partes do estado
    state.profile.pix = cleanPix(state.profile.pix);

  /* ---------- Eventos ---------- */

  function on(evt, fn) { (handlers[evt] = handlers[evt] || []).push(fn); }

  function get() { return state; }

  function tomb(k, id) {

  }

  /* ---------- Anotações ---------- */
  function checkMoney(v, label) {
    const a = Math.round(Number(v));
    if (!Number.isFinite(a) || a < 1) throw new Error(`Digite ${label} maior que zero.`);
    if (a > U.MAX_CENTS) throw new Error('Esse valor é alto demais.');
    return a;
  }
  function addTransaction(d) {
    const type = d.type === 'in' ? 'in' : 'out';
    const amount = checkMoney(d.amount, 'um valor');
    if (!U.isValidISO(d.date)) throw new Error('Escolha uma data válida.');
    if (d.date > U.today()) throw new Error('A data não pode ser no futuro. Para o que vai vencer, use Contas.');
    const t = now();
    const tx = { id: U.uid(), type, amount, category: categoryInfo(type, d.category).id, note: str(d.note, 80), date: d.date, createdAt: t, updatedAt: t };
    if (d.billId) tx.billId = d.billId;
    if (d.goalId) tx.goalId = d.goalId;
    if (d.category === 'meta' && type === 'out') tx.category = 'meta';
    update((s) => { s.transactions.push(tx); });
    emit('transaction:added', tx);
    return tx;
  }
  function updateTransaction(id, d) {
    const tx = state.transactions.find((x) => x.id === id);
    if (!tx) throw new Error('Essa anotação não existe mais.');
    const type = d.type === 'in' ? 'in' : 'out';
    const amount = checkMoney(d.amount, 'um valor');
    if (!U.isValidISO(d.date)) throw new Error('Escolha uma data válida.');
    if (d.date > U.today()) throw new Error('A data não pode ser no futuro.');
    update((s) => {
      Object.assign(tx, { type, amount, category: categoryInfo(type, d.category).id, note: str(d.note, 80), date: d.date, updatedAt: now() });
    });
    return tx;
  }
  function deleteTransaction(id) {
    const tx = state.transactions.find((x) => x.id === id);
    if (!tx) return null;
    update((s) => { s.transactions = s.transactions.filter((x) => x.id !== id); tomb('t', id); });
    return tx;
  }
  function getTransaction(id) { return state.transactions.find((x) => x.id === id) || null; }
  const byDateDesc = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt);
  function recentTx(n) { return state.transactions.slice().sort(byDateDesc).slice(0, n); }
  function txInRange(from, to) { return state.transactions.filter((t) => t.date >= from && t.date <= to).sort(byDateDesc); }
  /** Entrou, Saiu (sem o que foi guardado em metas), Guardado e Sobrou. */
  function totals(list) {
    let inn = 0, out = 0, saved = 0;
    for (const t of list) {
      if (t.type === 'in') inn += t.amount;
      else if (t.category === 'meta') saved += t.amount;
      else out += t.amount;
    }
    return { in: inn, out, saved, net: inn - out - saved };
  }

  /* ---------- Contas ---------- */
  function cleanBillInput(d) {
    const kind = d.kind === 'receive' ? 'receive' : 'pay';
    const title = str(d.title, 50);
    if (!title) throw new Error(kind === 'pay' ? 'Dê um nome para a conta. Ex.: conta de luz.' : 'Diga o que você vendeu ou fez.');
    const amount = checkMoney(d.amount, 'o valor da conta');
    if (!U.isValidISO(d.dueDate)) throw new Error('Escolha uma data de vencimento válida.');
    let phone = '';
    if (kind === 'receive' && str(d.phone, 20)) {
      const n = U.normalizePhoneBR(d.phone);
      if (!n) throw new Error('Esse WhatsApp parece errado. Digite com DDD, por exemplo (81) 90000-0000.');
      phone = U.formatPhoneBR(d.phone);
    }
    return { kind, title, amount, dueDate: d.dueDate, recurring: !!d.recurring, person: kind === 'receive' ? str(d.person, 40) : '', phone };
  }
  function addBill(d) {
    const c = cleanBillInput(d);
    const t = now();
    const bill = Object.assign({ id: U.uid(), status: 'open', recurDay: Number(c.dueDate.slice(8)), txid: 'CAD' + U.randomAlnum(12), createdAt: t, updatedAt: t }, c);
    update((s) => { s.bills.push(bill); });
    return bill;
  }
  function updateBill(id, d) {
    const b = state.bills.find((x) => x.id === id);
    if (!b) throw new Error('Essa conta não existe mais.');

    update(() => { Object.assign(b, c, { recurDay: Number(c.dueDate.slice(8)), updatedAt: now() }); });
    return b;
  }
  function getBill(id) { return state.bills.find((x) => x.id === id) || null; }
  function openBills() { return state.bills.filter((b) => b.status === 'open').sort((a, b) => (a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : a.createdAt - b.createdAt)); }
  function doneBills(n) { return state.bills.filter((b) => b.status === 'done').sort((a, b) => ((a.paidAt || '') < (b.paidAt || '') ? 1 : -1)).slice(0, n || 50); }
  function settleBill(id) {
    const b = getBill(id);
    if (!b || b.status !== 'open') return null; // clique duplo não paga duas vezes
    const t = now();
    const date = U.today();
    const isRecv = b.kind === 'receive';
    const tx = { id: U.uid(), type: isRecv ? 'in' : 'out', amount: b.amount, category: isRecv ? 'vendas' : 'contas', note: str(b.title + (isRecv && b.person ? ' - ' + b.person : ''), 80), date, billId: b.id, createdAt: t, updatedAt: t };
    let next = null;
    const first = !b.xpAwarded;
    update((s) => {
      s.transactions.push(tx);
      b.status = 'done'; b.paidAt = date; b.txId = tx.id; b.updatedAt = t; b.xpAwarded = true;
      if (b.recurring) {
        next = Object.assign({}, b, { id: U.uid(), dueDate: U.addMonths(b.dueDate, 1, b.recurDay), status: 'open', txid: 'CAD' + U.randomAlnum(12), createdAt: t, updatedAt: t });
        delete next.paidAt; delete next.lastChargeAt; delete next.txId; delete next.nextId; delete next.xpAwarded;
        b.nextId = next.id;
        s.bills.push(next);
      }
    });
    emit('bill:settled', { bill: b, first });
    return { bill: b, tx, next };
  }
  function reopenBill(id) {
    const b = getBill(id);
    if (!b || b.status !== 'done') return null;
    update((s) => {
      if (b.txId) { s.transactions = s.transactions.filter((x) => x.id !== b.txId); tomb('t', b.txId); }
      if (b.nextId) {
        const nx = s.bills.find((x) => x.id === b.nextId);
        if (nx && nx.status === 'open' && nx.updatedAt === nx.createdAt) { s.bills = s.bills.filter((x) => x.id !== nx.id); tomb('b', nx.id); }
      }
      b.status = 'open'; b.paidAt = null; delete b.paidAt; delete b.txId; delete b.nextId; b.updatedAt = now();
    });
    return b;
  }
  function deleteBill(id) {
    const b = getBill(id);
    if (!b) return null;
    update((s) => { s.bills = s.bills.filter((x) => x.id !== id); tomb('b', id); });
    return b;
  }
  function markChargeSent(id) {
    const b = getBill(id);
    if (!b) return;
    const firstToday = b.lastChargeAt !== U.today();
    update((s) => { b.lastChargeAt = U.today(); b.updatedAt = now(); s.game.chargesSent = (s.game.chargesSent || 0) + 1; });
    emit('charge:sent', { bill: b, first: firstToday });
  }

  /* ---------- Metas ---------- */
  function addGoal(d) {
    const title = str(d.title, 40);
    if (!title) throw new Error('Dê um nome para a meta. Ex.: reserva de emergência.');
    const target = checkMoney(d.target, 'o valor da meta');
    const t = now();
    const g = { id: U.uid(), title, target, saved: 0, createdAt: t, updatedAt: t };
    update((s) => { s.goals.push(g); });
    emit('goal:created', g);
    return g;
  }
  function getGoal(id) { return state.goals.find((x) => x.id === id) || null; }
  function depositGoal(id, amount) {
    const g = getGoal(id);
    if (!g) throw new Error('Essa meta não existe mais.');
    if (g.doneAt) throw new Error('Essa meta já foi batida.');
    const a = checkMoney(amount, 'um valor');
    const t = now();
    const tx = { id: U.uid(), type: 'out', amount: a, category: 'meta', note: str('Meta: ' + g.title, 80), date: U.today(), goalId: g.id, createdAt: t, updatedAt: t };
    update((s) => {
      s.transactions.push(tx);
      g.saved = Math.min(U.MAX_CENTS, g.saved + a); g.updatedAt = t;
      if (g.saved >= g.target) g.doneAt = U.today();
    });
    emit('goal:deposit', { goal: g, tx });
    return g;
  }
  function deleteGoal(id) {
    const g = getGoal(id);
    if (!g) return null;
    update((s) => { s.goals = s.goals.filter((x) => x.id !== id); tomb('g', id); });
    return g;
  }

  /** Desfazer exclusão: devolve o registro e apaga a "lápide" para a sincronização não o remover de novo. */
  function restore(kind, rec) {
    const k = { tx: 't', bill: 'b', goal: 'g' }[kind];
    const list = { tx: 'transactions', bill: 'bills', goal: 'goals' }[kind];
    update((s) => {
      s.deleted = s.deleted.filter((d) => !(d.k === k && d.id === rec.id));
      if (!s[list].some((x) => x.id === rec.id)) s[list].push(Object.assign({}, rec, { updatedAt: now() }));
    });
  }

  /* ---------- Perfil ---------- */
  function setProfile(patch) {
    update((s) => {
      const p = Object.assign({}, patch);
      if ('name' in p) p.name = str(p.name, 30);
      if ('pix' in p) p.pix = cleanPix(p.pix);
      if ('budget' in p) p.budget = U.clamp(posInt(p.budget), 0, U.MAX_CENTS);
      Object.assign(s.profile, p, { updatedAt: now() });
    });
  }

  /* ---------- Substituir tudo (restaurar, exemplo, apagar) ---------- */
  function safetyCopy() {
    try { safeSet(SAFETY, JSON.stringify({ at: now(), data: state })); } catch (e) { /* extra */ }
  }

    try { const o = JSON.parse(safeGet(SAFETY) || 'null'); return o && o.data ? { at: o.at, counts: { t: (o.data.transactions || []).length, b: (o.data.bills || []).length, g: (o.data.goals || []).length } } : null; } catch (e) { return null; }
  }
  /** Troca os dados por `next`. Gera lápides do que sumiu e carimba o que entrou, para a nuvem refletir a troca. */
  function replaceAll(next, opts) {
    opts = opts || {};

    const keep = state;
    const nextIds = { t: new Set(next.transactions.map((x) => x.id)), b: new Set(next.bills.map((x) => x.id)), g: new Set(next.goals.map((x) => x.id)) };
    const deleted = keep.deleted.slice();
    [['t', keep.transactions], ['b', keep.bills], ['g', keep.goals]].forEach(([k, list]) => list.forEach((x) => { if (!nextIds[k].has(x.id)) deleted.push({ k, id: x.id, at: t }); }));
    next.transactions.forEach((x) => { x.updatedAt = t; }); next.bills.forEach((x) => { x.updatedAt = t; }); next.goals.forEach((x) => { x.updatedAt = t; });
    next.deleted = deleted.filter((d) => !nextIds[d.k].has(d.id) || d.at < t);

  /* ---------- Backup ---------- */
  function exportJSON() {
    return JSON.stringify({ app: 'caderninho', version: 3, exportedAt: new Date().toISOString(), data: state }, null, 1);
  }
  function importJSON(text) {
    if (typeof text !== 'string' || text.length > 8 * 1024 * 1024) throw new Error('Arquivo grande demais ou ilegível.');

  }
  function exportCSV(list) {
    const rows = [['Data', 'Tipo', 'Categoria', 'Valor (R$)', 'Anotação']];
    list.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((t) => {
      rows.push([U.formatDate(t.date), t.type === 'in' ? 'Entrada' : t.category === 'meta' ? 'Guardado em meta' : 'Saída', categoryInfo(t.type, t.category).label, (t.type === 'in' ? '' : '-') + U.centsToInput(t.amount), t.note]);

  /* ---------- Mesclagem (nuvem x aparelho) ---------- */
  function merge(a, b) {
    const out = blank();
    const tombMap = new Map();
    [...a.deleted, ...b.deleted].forEach((d) => { const key = d.k + d.id; const p = tombMap.get(key); if (!p || d.at > p.at) tombMap.set(key, d); });
    const pick = (k, la, lb) => {
      const m = new Map();
      [...la, ...lb].forEach((x) => { const p = m.get(x.id); if (!p || x.updatedAt > p.updatedAt) m.set(x.id, x); });
      return Array.from(m.values()).filter((x) => { const t = tombMap.get(k + x.id); return !t || t.at < x.updatedAt; });
    };
    out.transactions = pick('t', a.transactions, b.transactions);
    out.bills = pick('b', a.bills, b.bills);
    out.goals = pick('g', a.goals, b.goals);
    const limit = now() - TOMBSTONE_DAYS * 86400000;
    out.deleted = Array.from(tombMap.values()).filter((d) => d.at > limit);
    const ga = a.game, gb = b.game;
    out.game.xp = Math.max(ga.xp, gb.xp);
    out.game.achievements = Object.assign({}, gb.achievements, ga.achievements);
    out.game.days = Array.from(new Set([...ga.days, ...gb.days])).sort().slice(-400);
    out.game.daily = (ga.daily.date || '') >= (gb.daily.date || '') ? ga.daily : gb.daily;
    out.game.chargesSent = Math.max(ga.chargesSent, gb.chargesSent);
    out.profile = Object.assign({}, a.profile.updatedAt >= b.profile.updatedAt ? a.profile : b.profile);
    return out;
  }
  /** Aplica um estado vindo da nuvem sem bagunçar a ordem de salvar/sincronizar. */
  function applyMerged(next) { state = next; persist(); notify(true); }

  /* ---------- Dados de exemplo ---------- */
  function demoState() {
    const n = blank();
    const t0 = now();
    const today = U.today();
    const mk = (type, amount, category, note, daysAgo) => ({ id: U.uid(), type, amount, category, note, date: U.addDays(today, -daysAgo), createdAt: t0 - daysAgo * 1000, updatedAt: t0 });
    const tx = [
      mk('in', 320000, 'vendas', 'Faxinas da semana', 1), mk('out', 18450, 'mercado', 'Feira e mercado', 1), mk('out', 4200, 'transporte', 'Passagens', 2),

    // histórico de meses anteriores para o gráfico do Resumo
    const hist = [[35, 410000, 255000], [65, 395000, 281000], [95, 430000, 300000], [125, 380000, 262000], [155, 405000, 290000]];
    hist.forEach(([d, inn, out], i) => {
      tx.push(mk('in', inn, i % 2 ? 'salario' : 'vendas', 'Renda do mês', d));

/* ===== 05-game.js ===== */
/* ==========================================================================
   Game — XP, níveis, sequência diária (streak) e conquistas.
   É a "marca" da Purytalent no app: finanças com cara de jogo.
   Para criar uma conquista nova, basta adicionar um item em ACHIEVEMENTS.

   Anti-"farm": anotações valem XP só nas 5 primeiras do dia; baixa de conta e
   cobrança só valem XP na primeira vez (desfazer e refazer não rende XP);
   depósitos em metas valem XP em até 3 por dia.
   ========================================================================== */
(function (global) {
  'use strict';

  const C = (global.Caderninho = global.Caderninho || {});
  const U = C.Utils;
  const Store = C.Store;

  const XP = { transaction: 10, bill: 20, charge: 15, goalCreated: 10, goalDeposit: 10, achievement: 30 };
  const DAILY_TX_XP_CAP = 5;
  const DAILY_DEPOSIT_XP_CAP = 3;

  const xpAt = (level) => 50 * level * (level - 1); // nível 2 = 100xp, 3 = 300xp, 4 = 600xp...

  function levelFor(xp) {
    xp = Math.max(0, Number(xp) || 0);
    let level = 1;
    while (xp >= xpAt(level + 1)) level += 1;
    const base = xpAt(level);
    const next = xpAt(level + 1);
    return { level, title: TITLES[Math.min(level, TITLES.length) - 1], xp, base, next, into: xp - base, span: next - base, progress: (xp - base) / (next - base) };
  }

  /** Dias seguidos em que a pessoa anotou algo (baseado no dia real, não na data do lançamento). */
  function streak(state) {
    const days = new Set(state.game.days || []);
    const today = U.today();
    const loggedToday = days.has(today);
    let cursor = loggedToday ? today : U.addDays(today, -1);
    let count = 0;
    while (days.has(cursor)) { count += 1; cursor = U.addDays(cursor, -1); }
    return { count, loggedToday, atRisk: !loggedToday && count > 0 };
  }

  const ACHIEVEMENTS = [
    { id: 'first_tx', icon: 'pencil', title: 'Primeira anotação', desc: 'Anote seu primeiro lançamento.', check: (s) => s.transactions.length >= 1 },
    { id: 'tx_10', icon: 'notebook', title: 'Caderno cheio', desc: 'Chegue a 10 anotações.', check: (s) => s.transactions.length >= 10 },
    { id: 'tx_50', icon: 'library', title: 'Biblioteca', desc: 'Chegue a 50 anotações.', check: (s) => s.transactions.length >= 50 },
    { id: 'streak_3', icon: 'flame', title: 'Pegando o ritmo', desc: 'Anote 3 dias seguidos.', check: (s, x) => x.streak >= 3 },
    { id: 'streak_7', icon: 'bolt', title: 'Semana perfeita', desc: 'Anote 7 dias seguidos.', check: (s, x) => x.streak >= 7 },
    { id: 'streak_30', icon: 'crown', title: 'Hábito de ferro', desc: 'Anote 30 dias seguidos.', check: (s, x) => x.streak >= 30 },
    { id: 'first_paid', icon: 'check-circle', title: 'Conta em dia', desc: 'Pague uma conta pelo app.', check: (s) => s.bills.some((b) => b.status === 'done' && b.kind === 'pay') },
    { id: 'first_received', icon: 'banknote', title: 'Dinheiro na mão', desc: 'Receba uma conta pelo app.', check: (s) => s.bills.some((b) => b.status === 'done' && b.kind === 'receive') },
    { id: 'first_charge', icon: 'message', title: 'Cobrança enviada', desc: 'Cobre alguém pelo WhatsApp.', check: (s) => (s.game.chargesSent || 0) >= 1 },
    { id: 'first_pix', icon: 'qr', title: 'Pix configurado', desc: 'Cadastre sua chave Pix.', check: (s) => !!s.profile.pix },
    { id: 'first_goal', icon: 'target', title: 'Sonhando alto', desc: 'Crie sua primeira meta.', check: (s) => s.goals.length >= 1 },
    { id: 'goal_done', icon: 'trophy', title: 'Meta batida!', desc: 'Complete uma meta.', check: (s) => s.goals.some((g) => g.doneAt) },
    {
      id: 'blue_month', icon: 'heart', title: 'Mês no azul', desc: 'Ganhe mais do que gasta no mês (mín. 5 anotações).',
      check: (s) => {
        const list = s.transactions.filter((t) => t.date.startsWith(U.monthKey(U.today())));
        const t = Store.totals(list);
        return list.length >= 5 && t.in > t.out + t.saved;
      },
    },
  ];

  const api = { lastGain: 0, ACHIEVEMENTS, XP, TITLES };

  function gain(amount) {
    const before = levelFor(Store.get().game.xp);
    Store.update((s) => { s.game.xp += amount; });
    api.lastGain += amount;
    const after = levelFor(Store.get().game.xp);

  }

    Store.update((s) => {
      const t = U.today();

    }, { silent: true });
  }
  /** Contador por dia ("daily"), reiniciado sozinho quando o dia muda. Devolve o valor depois de somar 1. */
  function bump(field) {
    let n = 0;
    Store.update((s) => {
      const t = U.today();
      if (s.game.daily.date !== t) s.game.daily = { date: t, count: 0, deposits: 0 };
      s.game.daily[field] = (s.game.daily[field] || 0) + 1;

  }

  function evaluate(opts) {
    const silent = opts && opts.silent;

    const fresh = ACHIEVEMENTS.filter((a) => !s.game.achievements[a.id] && a.check(s, ctx));
    if (!fresh.length) return [];
    Store.update((st) => { fresh.forEach((a) => { st.game.achievements[a.id] = U.today(); }); });
    gain(fresh.length * XP.achievement);
    if (!silent && C.UI) fresh.forEach((a) => C.UI.toast(`Conquista: ${a.title}`, 'gold'));
    return fresh;
  }

  function init() {
    Store.on('transaction:added', () => {
      markActiveToday();
      const n = bump('count');
      if (n <= DAILY_TX_XP_CAP) gain(XP.transaction);
      evaluate();
    });
    Store.on('bill:settled', (p) => { markActiveToday(); if (p && p.first) gain(XP.bill); evaluate(); });
    Store.on('charge:sent', (p) => { if (p && p.first) gain(XP.charge); evaluate(); });
    Store.on('goal:created', () => { gain(XP.goalCreated); evaluate(); });
    Store.on('goal:deposit', () => { markActiveToday(); if (bump('deposits') <= DAILY_DEPOSIT_XP_CAP) gain(XP.goalDeposit); evaluate(); });

  }

  C.Game = api;
})(typeof window !== 'undefined' ? window : globalThis);

/* ==========================================================================
   UI — toast, bottom-sheet, confirmação e pequenos componentes de HTML
   ========================================================================== */
(function (global) {
  'use strict';

  const C = (global.Caderninho = global.Caderninho || {});
  const U = C.Utils;
  const esc = U.escapeHTML;
  const I = C.Icons.svg;

  /* ---------- Toast ---------- */
  function toast(msg, tone, opts) {
    opts = opts || {};
    let host = document.getElementById('toasts');
    if (!host) { host = document.createElement('div'); host.id = 'toasts'; host.className = 'toasts'; host.setAttribute('role', 'status'); host.setAttribute('aria-live', 'polite'); document.body.appendChild(host); }
    while (host.children.length >= 3) host.firstChild.remove();
    const el = document.createElement('div');
    el.className = 'toast ' + (tone || '');
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    if (opts.action) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = opts.action.label;
      b.addEventListener('click', () => { try { opts.action.run(); } finally { el.remove(); } });
      el.appendChild(b);
    }
    host.appendChild(el);
    setTimeout(() => el.remove(), opts.action ? 7000 : (tone === 'error' ? 5000 : 3200));
  }

  /* ---------- Sheet (folha que sobe de baixo) ---------- */
  const stack = [];
  let skipPop = 0;

  function openSheet(o) {
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.titleText || String(o.title).replace(/<[^>]+>/g, ''))}">
        <div class="sheet-head"><h2>${o.title}</h2><button type="button" class="icon-btn" data-close aria-label="Fechar">${I('x')}</button></div>
        <div class="sheet-body">${o.html || ''}</div>
      </div>`;
    const sheet = { el: overlay, body: overlay.querySelector('.sheet-body'), closed: false, close };
    const opener = document.activeElement;
    function close(fromPop) {
      if (sheet.closed) return;
      sheet.closed = true;
      const i = stack.indexOf(sheet);
      if (i >= 0) stack.splice(i, 1);
      overlay.remove();
      if (!stack.length) document.body.classList.remove('sheet-open');
      if (!fromPop && global.history.state && global.history.state.cadSheet) { skipPop++; global.history.back(); }
      try { if (o.onClose) o.onClose(); } catch (e) { console.error(e); }
      try { if (opener && opener.focus && document.contains(opener)) opener.focus(); } catch (e) { /* ignore */ }
    }
    overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) sheet.down = true; });
    overlay.addEventListener('click', (e) => { if (e.target === overlay && sheet.down && !o.persistent) close(); sheet.down = false; });
    overlay.querySelector('[data-close]').addEventListener('click', () => close());
    document.body.appendChild(overlay);
    document.body.classList.add('sheet-open');
    stack.push(sheet);
    try { global.history.pushState({ cadSheet: stack.length }, '', global.location.href); } catch (e) { /* ignore */ }
    C.Icons.hydrate(overlay);
    try { if (o.onMount) o.onMount(sheet.body, sheet); } catch (e) { console.error(e); toast('Algo deu errado ao abrir', 'error'); close(); return sheet; }
    const first = sheet.body.querySelector('input:not([type=checkbox]):not([readonly]), textarea:not([readonly])');
    // só foca o primeiro campo se a pessoa ainda não tocou em nenhum (senão rouba o foco no meio da digitação)
    if (first && !o.noFocus) setTimeout(() => { try { if (!sheet.closed && !sheet.body.contains(document.activeElement)) first.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 60);
    return sheet;
  }

    if (skipPop > 0) { skipPop--; return; }
    const top = stack[stack.length - 1];

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const dlg = document.querySelector('.overlay.center');
    if (dlg) { dlg.dispatchEvent(new CustomEvent('cancel')); return; }
    const top = stack[stack.length - 1];
    if (top) top.close();
  });

  function confirmDialog(o) {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'overlay center';
      overlay.innerHTML = `
        <div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(o.title)}">
          <h2>${esc(o.title)}</h2>
          <p>${o.html ? o.message : esc(o.message)}</p>
          <div class="actions">
            <button type="button" class="btn ghost grow" data-no>${esc(o.cancelLabel || 'Cancelar')}</button>
            <button type="button" class="btn ${o.danger ? 'danger' : 'primary'} grow" data-yes>${esc(o.okLabel || 'OK')}</button>
          </div>
        </div>`;
      let done = false;
      const prevFocus = document.activeElement;
      const end = (v) => { if (done) return; done = true; overlay.remove(); try { prevFocus && prevFocus.focus && prevFocus.focus(); } catch (e) { /* ignore */ } resolve(v); };
      overlay.querySelector('[data-yes]').addEventListener('click', () => end(true));
      overlay.querySelector('[data-no]').addEventListener('click', () => end(false));
      overlay.addEventListener('cancel', () => end(false));
      overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) end(false); });
      document.body.appendChild(overlay);
      overlay.querySelector(o.danger ? '[data-no]' : '[data-yes]').focus();

  }

  /* ---------- Componentes de HTML ---------- */
  /** Cartãozinho de explicação. tone: info (azul) | tip (amarelo) | warn (vermelho) | ok (verde). force = aparece mesmo com explicações desligadas. */
  function help(html, o) {
    o = o || {};
    const tone = o.tone || 'info';
    const icon = o.icon || (tone === 'tip' ? 'bulb' : tone === 'warn' ? 'alert' : tone === 'ok' ? 'check-circle' : 'info');
    return `<div class="help ${tone}${o.force ? ' force' : ''}" role="note">${I(icon)}<div>${o.title ? `<span class="h-title">${esc(o.title)}</span>` : ''}${html}</div></div>`;
  }

  function txRow(t) {
    const info = C.Store.categoryInfo(t.type, t.category);
    const isMeta = t.category === 'meta';
    const cls = t.type === 'in' ? 'in' : isMeta ? 'meta' : 'out';
    return `
      <button type="button" class="row" data-action="tx:edit" data-id="${esc(t.id)}" aria-label="${esc(t.note || info.label)}, ${U.formatMoney(t.amount)}">
        <span class="row-ico ${cls}" aria-hidden="true">${I(info.icon)}</span>

  /** Campo de valor com máscara de banco: digita 1250 e vira 12,50. */
  function bindMoney(input) {
    const fmt = () => {
      const before = input.value;
      const v = U.maskMoney(before);
      if (v !== before) input.value = v;
    };

    input.addEventListener('focus', () => { setTimeout(() => { try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) { /* ignore */ } }, 0); });
    fmt();
  }

    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';

    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

})(typeof window !== 'undefined' ? window : globalThis);

          <input type="text" name="note" maxlength="80" placeholder="Ex.: feira da semana" value="${editing ? esc(editing.note) : ''}">
        </label>
        <div class="actions">
          ${editing ? '<button type="button" class="btn danger-ghost" data-del>Excluir</button>' : ''}
          <button type="submit" class="btn primary grow">Salvar</button>
        </div>
      </form>`;

    UI.openSheet({
      title: editing ? 'Editar anotação' : 'Nova anotação',
      html,
      onMount(body, sheet) {
        const form = body.querySelector('form');
        const chips = body.querySelector('[data-cats]');
        const el = form.elements;
        UI.bindMoney(el.amount);

        function paint() {
          body.querySelectorAll('.seg-btn').forEach((b) => { const on = b.dataset.t === type; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
          const list = Store.CATEGORIES[type];
          if (!list.some((c) => c.id === category)) category = list[list.length - 1].id;
          chips.innerHTML = list.map((c) => `<button type="button" class="chip-b ${c.id === category ? 'active' : ''}" data-cat="${c.id}" aria-pressed="${c.id === category}">${I(c.icon)} ${c.label}</button>`).join('');
        }
        body.querySelectorAll('.seg-btn').forEach((b) => b.addEventListener('click', () => { type = b.dataset.t; paint(); }));
        chips.addEventListener('click', (e) => { const b = e.target.closest('[data-cat]'); if (b) { category = b.dataset.cat; paint(); } });
        body.querySelector('[data-days]').addEventListener('click', (e) => {
          const b = e.target.closest('[data-d]');
          if (b) el.date.value = U.addDays(U.today(), Number(b.dataset.d));
        });
        paint();

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          clearErrors(form);
          const amount = U.parseMoney(el.amount.value);
          if (amount <= 0) return fieldError(el.amount, 'Digite quanto foi.');
          if (!U.isValidISO(el.date.value)) return fieldError(el.date, 'Escolha uma data válida.');
          if (el.date.value > U.today()) return fieldError(el.date, 'A data não pode ser no futuro. Para o que vai vencer, use Contas.');
          const data = { type, amount, category, date: el.date.value, note: el.note.value };
          const ok = safely(() => {
            if (editing) { Store.updateTransaction(editing.id, data); UI.toast('Anotação alterada', 'success'); }
            else { Game.lastGain = 0; Store.addTransaction(data); UI.toast(Game.lastGain ? `Anotado! +${Game.lastGain} XP` : 'Anotado!', 'success'); }
            return true;
          });
          if (ok) sheet.close();
        });

        const del = body.querySelector('[data-del]');
        if (del) del.addEventListener('click', () => {
          const tx = Store.deleteTransaction(editing.id);
          sheet.close();
          if (tx) UI.toast('Anotação excluída', 'info', { action: { label: 'Desfazer', run: () => { Store.restore('tx', tx); UI.toast('Anotação de volta', 'success'); } } });
        });
      },
    });
  }

  /* ======================================================================
     Meu Pix (chave para receber)
     ====================================================================== */
  function openPixForm() {
    const cur = Store.get().profile.pix || {};
    let type = cur.type || 'cpf';
    UI.openSheet({
      title: 'Meu Pix',
      html: `
        <form class="form" autocomplete="off" novalidate>
          ${UI.help('Cadastre a chave em que você recebe. Nas contas <b>a receber</b>, o app cria o <b>Pix copia e cola</b> e o <b>QR Code</b> já com o valor certo. O nome e a cidade devem ser iguais aos do seu banco.', { title: 'Receber por Pix' })}
          ${UI.help('O app <b>não sabe</b> se o cliente pagou. Quando o dinheiro cair na sua conta, toque em <b>Recebi</b>. Confira sempre o nome que aparece no app do banco antes de confirmar.', { tone: 'warn', force: true })}
          <div class="field"><span>Tipo da chave</span><div class="chips" data-types></div></div>
          <label class="field"><span>Sua chave Pix</span>
            <input type="text" name="key" maxlength="80" autocapitalize="off" autocomplete="off" spellcheck="false" value="${esc(cur.key || '')}">
          </label>
          <label class="field"><span>Seu nome <em>(como aparece no banco, até 25 letras)</em></span>
            <input type="text" name="name" maxlength="40" placeholder="Ex.: Maria da Silva" value="${esc(cur.name || Store.get().profile.name || '')}">
          </label>
          <label class="field"><span>Sua cidade <em>(até 15 letras)</em></span>
            <input type="text" name="city" maxlength="30" placeholder="Ex.: Recife" value="${esc(cur.city || '')}">
          </label>
          <p class="hint" data-preview></p>
          <div class="actions">
            ${cur.key ? '<button type="button" class="btn danger-ghost" data-clear>Remover</button>' : ''}
            <button type="submit" class="btn primary grow">Salvar Pix</button>
          </div>
        </form>`,
      onMount(body, sheet) {
        const form = body.querySelector('form');
        const el = form.elements;
        const chips = body.querySelector('[data-types]');
        const preview = body.querySelector('[data-preview]');

        function updatePreview() {
          const n = C.Pix.clean(el.name.value, 25), c = C.Pix.clean(el.city.value, 15);
          const bits = [];
          if ((el.name.value.trim() && n !== el.name.value.trim()) || (el.city.value.trim() && c !== el.city.value.trim())) bits.push(`No QR Code vai aparecer: <b>${esc(n || '—')}</b> · <b>${esc(c || '—')}</b> (o padrão do Pix não aceita acentos).`);
          preview.innerHTML = bits.join(' ');
        }
        function paint() {
          const t = C.Pix.KEY_TYPES.find((x) => x.id === type);
          chips.innerHTML = C.Pix.KEY_TYPES.map((x) => `<button type="button" class="chip-b ${x.id === type ? 'active' : ''}" data-type="${x.id}" aria-pressed="${x.id === type}">${esc(x.label)}</button>`).join('');
          el.key.placeholder = t.placeholder;
          el.key.inputMode = type === 'email' ? 'email' : type === 'random' ? 'text' : 'numeric';
        }
        chips.addEventListener('click', (e) => { const b = e.target.closest('[data-type]'); if (b) { type = b.dataset.type; clearErrors(form); paint(); } });
        el.key.addEventListener('input', () => {
          const d = C.Pix.detectType(el.key.value);
          if (d && d !== type) { type = d; paint(); }
        });
        el.name.addEventListener('input', updatePreview); el.city.addEventListener('input', updatePreview);
        paint(); updatePreview();

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          clearErrors(form);
          let key;
          try { key = C.Pix.validateKey(type, el.key.value); } catch (err) { return fieldError(el.key, err.message); }
          const name = el.name.value.trim();
          const city = el.city.value.trim();
          if (!C.Pix.clean(name, 25)) return fieldError(el.name, 'Digite o seu nome (letras e números).');
          if (!C.Pix.clean(city, 15)) return fieldError(el.city, 'Digite a sua cidade (letras e números).');
          // prova real: gera um código de teste e confere antes de salvar
          try {
            const test = C.Pix.build({ key, name, city, amountCents: 100, txid: 'TESTE' });
            const v = C.Pix.verify(test);
            if (!v.ok) throw new Error(v.errors[0]);
            C.QR.encode(test, 'M');
          } catch (err) { UI.toast('Não consegui gerar um Pix com esses dados: ' + err.message, 'error'); return; }
          Store.setProfile({ pix: { type, key, name, city } });
          Store.emit('pix:saved');
          UI.toast('Pix salvo! Toque em "Testar" no Perfil para ver o QR.', 'success');
          sheet.close();
        });

        const clear = body.querySelector('[data-clear]');
        if (clear) clear.addEventListener('click', async () => {
          const yes = await UI.confirmDialog({ title: 'Remover Pix?', message: 'As cobranças deixam de levar o Pix copia e cola.', okLabel: 'Remover', danger: true });
          if (!yes) return;
          Store.setProfile({ pix: null });
          UI.toast('Pix removido', 'info');
          sheet.close();
        });
      },
    });
  }

  function openAccountForm() {
    const Sync = C.Sync;
    if (!Sync || !Sync.isConfigured()) { UI.toast('A conta ainda não está disponível neste app', 'info'); return; }
    let mode = 'in';

    UI.openSheet({
      title: 'Minha conta',
      html: `
        <form class="form" autocomplete="on" novalidate>
          ${UI.help('Com uma conta, seus dados ficam guardados na nuvem e você usa o Caderninho em outros aparelhos. <b>O app continua funcionando sem internet</b>: o que você anotar é enviado quando a internet voltar.', { title: 'Para que serve' })}
          <div class="seg" role="group" aria-label="Entrar ou criar conta">
            <button type="button" class="seg-btn" data-m="in">Entrar</button>
            <button type="button" class="seg-btn" data-m="up">Criar conta</button>
          </div>
          <label class="field"><span>Seu e-mail</span>
            <input type="email" name="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="120" placeholder="voce@exemplo.com">
          </label>
          <label class="field"><span>Senha <em data-pw-hint></em></span>
            <input type="password" name="password" autocomplete="current-password" maxlength="72">
          </label>
          <label class="check"><input type="checkbox" name="show"> Mostrar a senha</label>
          <p class="form-msg" data-msg role="alert" hidden></p>
          <div class="actions"><button type="submit" class="btn primary grow" data-submit>Entrar</button></div>
          <button type="button" class="link" data-forgot style="text-align:center">Esqueci minha senha</button>
        </form>`,
      onMount(body, sheet) {
        const form = body.querySelector('form');
        const el = form.elements;
        const msg = body.querySelector('[data-msg]');
        const submit = body.querySelector('[data-submit]');
        const forgot = body.querySelector('[data-forgot]');
        let busy = false;
        let lastPending = null;

        function say(text, tone) { msg.hidden = !text; msg.textContent = text || ''; msg.className = 'form-msg' + (tone ? ' ' + tone : ''); }
        function label() { submit.textContent = mode === 'in' ? 'Entrar' : 'Criar minha conta'; }
        function paint() {
          body.querySelectorAll('.seg-btn').forEach((b) => { const on = b.dataset.m === mode; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
          label();
          el.password.autocomplete = mode === 'in' ? 'current-password' : 'new-password';
          body.querySelector('[data-pw-hint]').textContent = mode === 'up' ? '(mínimo 8 caracteres)' : '';
          forgot.hidden = mode !== 'in';
          say('');
        }
        function setBusy(on) { busy = on; submit.disabled = on; forgot.disabled = on; if (on) submit.textContent = 'Aguarde…'; else label(); }
        const cleanMail = (v) => String(v || '').trim().toLowerCase();

        body.querySelectorAll('.seg-btn').forEach((b) => b.addEventListener('click', () => { if (!busy) { mode = b.dataset.m; paint(); } }));
        el.show.addEventListener('change', () => { el.password.type = el.show.checked ? 'text' : 'password'; });
        paint();

        async function confirmSwitch(pending) {
          lastPending = pending;
          const yes = await UI.confirmDialog({
            title: 'Trocar de conta?',
            message: 'Este aparelho tem dados de outra conta. Para entrar nesta, esses dados serão removidos daqui (eles continuam salvos na outra conta). Deseja continuar?',
            okLabel: 'Trocar de conta', danger: true,
          });
          if (yes) return run(pending);
          return undefined;
        }
        async function run(pending) {
          setBusy(true); say('');
          try {
            if (pending) { await Sync.continueWith(pending); UI.toast('Conta conectada', 'success'); sheet.close(); }
            else if (mode === 'in') { await Sync.signIn(el.email.value, el.password.value); UI.toast('Conta conectada', 'success'); sheet.close(); }
            else {
              const r = await Sync.signUp(el.email.value, el.password.value);
              if (r.needsConfirm) { mode = 'in'; paint(); say('Enviamos um e-mail de confirmação. Abra o e-mail, toque no link e depois volte aqui para entrar.', 'ok'); }
              else { UI.toast('Conta criada e conectada', 'success'); sheet.close(); }
            }
          } catch (e) {
            if (e && e.code === 'other-account') { setBusy(false); return await confirmSwitch(e.pending); }
            say((e && e.message) || 'Não deu certo. Tente de novo.', 'bad');
          } finally { if (busy) setBusy(false); }
          return undefined;
        }
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (busy) return;
          if (lastPending && cleanMail(el.email.value) === lastPending.user.email) confirmSwitch(lastPending); else run(null);
        });
        forgot.addEventListener('click', async () => {
          if (busy) return;
          setBusy(true); say('');
          try { await Sync.recover(el.email.value); say('Se esse e-mail tiver conta, você vai receber um link para criar uma nova senha.', 'ok'); }
          catch (e) { say((e && e.message) || 'Não deu certo. Tente de novo.', 'bad'); }
          finally { setBusy(false); }
        });
      },
    });
  }
