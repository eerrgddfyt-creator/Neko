<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neko Tower</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffb3cf">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&text=%20%210123456789ABCDEFGHIJKLMNOPQRSTUVWXYZx%E3%81%82%E3%81%84%E3%81%92%E3%81%94%E3%81%95%E3%81%97%E3%81%99%E3%81%9F%E3%81%A3%E3%81%B0%E3%81%BE%E3%82%84%E3%82%AB%E3%82%AC%E3%82%AD%E3%82%AF%E3%82%B6%E3%82%B9%E3%82%BA%E3%83%83%E3%83%89%E3%83%90%E3%83%91%E3%83%94%E3%83%A9%E3%83%B3%E3%83%BC%E4%BC%9D%E4%BF%AE%E5%80%92%E5%89%A3%E5%8F%8C%E5%9C%A7%E5%A4%A9%E5%AE%8C%E5%BC%B7%E6%89%8D%E6%9C%80%E6%A5%AD%E6%B1%BA%E7%84%A1%E7%92%A7%E7%9A%84%E7%A5%9E%E7%BE%85%E8%80%85%E8%81%96%E8%87%A8%E8%A6%87%E8%AA%AC%E9%99%8D%E9%AB%98%E9%AC%BC&display=swap">
<link id="fontcss" rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
:root{--ink:#1b1a3a;--paper:#fffdf5;--pink:#ff7aa8;--sun:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Bangers,Impact,sans-serif;color:var(--ink)}
body{background:linear-gradient(var(--c1,#ffb3cf),var(--c2,#ffd9c2) 62%,var(--c3,#fff6d6))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;outline:none}
.box{background:var(--paper);border:.8vmin solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:1.2vmin 1.2vmin 0 var(--ink);filter:url(#rough);text-align:center;letter-spacing:.06em;color:var(--ink);font-family:inherit;appearance:none;padding:0;margin:0}
#menu{position:fixed;z-index:3;left:5vw;top:calc(env(safe-area-inset-top,0px) + 6vh);width:42vw;max-width:340px;height:66vh;display:flex;flex-direction:column;gap:2.2vh;transition:transform .95s cubic-bezier(.65,-.25,.75,1)}
#menu.out{transform:translateX(-150%)}
.grp{display:contents}
#logo{flex:1.5;background:var(--sun);transform:rotate(-2deg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5vmin;line-height:.95;animation:bob 3.2s ease-in-out infinite}
#logo small{font-size:3.6vmin;letter-spacing:.08em;margin-top:.6vh}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-1vh) scale(1.03)}}
.btn{flex:1;font-size:6.6vmin;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
#play{background:var(--pink);transform:rotate(1.4deg)}
#cfg,#back{transform:rotate(-1deg)}
.btn:active{transform:translate(.8vmin,.8vmin);box-shadow:.3vmin .3vmin 0 var(--ink)}
.grp:not(.hide)>.box{animation:btnIn .5s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--i,0)*.07s)}
.grp>:nth-child(2){--i:1}.grp>:nth-child(3){--i:2}.grp>:nth-child(4){--i:3}.grp>:nth-child(5){--i:4}.grp>:nth-child(6){--i:5}
@keyframes btnIn{from{opacity:0;transform:translateX(-30vw) rotate(-6deg) scale(.8)}}
#score{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 3vh);left:0;right:0;text-align:center;font-size:19vmin;color:#fff;-webkit-text-stroke:1.6vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .6s .5s}
#score.on{opacity:1}
#score.bump{animation:sb .25s}
@keyframes sb{50%{transform:scale(1.22)}}
#combo{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 3vh + 21vmin);left:0;right:0;text-align:center;font-size:7vmin;color:#ffd23f;-webkit-text-stroke:1vmin var(--ink);paint-order:stroke fill;opacity:0;pointer-events:none;transition:opacity .25s}
#combo.on{opacity:1}
#combo.bump{animation:cb .3s}
@keyframes cb{from{transform:scale(1.7) rotate(-4deg)}}
#tip{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14vh);transform:translateX(-50%) scale(.8);opacity:0;transition:.3s;max-width:82vw;padding:1.6vh 5vw;font-size:4.5vmin;pointer-events:none}
#tip.on{opacity:1;transform:translateX(-50%) scale(1)}
#over{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);transform:translateX(-50%) rotate(-1deg);padding:2vh 6vw;font-size:7vmin;white-space:nowrap;pointer-events:none}
#over:not(.hide){animation:overIn .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes overIn{from{transform:translateX(-50%) translateY(30vh) rotate(-8deg) scale(.6);opacity:0}}
#over small{display:block;font-size:4.2vmin;margin-top:.8vh}
#overTxt{white-space:pre-line}
#home,#pz{position:fixed;z-index:3;left:4vw;top:calc(env(safe-area-inset-top,0px) + 2vh);padding:1vh 4vw;font-size:5vmin;cursor:pointer;background:var(--sun)}
#codeIn{flex:1;font-size:7.4vmin;text-transform:uppercase;min-width:0;outline:none}
#codeIn::placeholder{color:#1b1a3a66}
#roomInfo,#misInfo,#sknInfo,#helpInfo{flex:2.4;font-size:4.2vmin;white-space:pre-line;display:flex;align-items:center;justify-content:center;line-height:1.25;padding:0 2vw}
#misInfo,#helpInfo{font-size:3.3vmin;flex:4}
#sknInfo{font-size:3.7vmin;flex:3}
#rank{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 1.2vh);right:3vw;font-size:4.4vmin;color:#fff;-webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;pointer-events:none}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg>div{position:absolute;will-change:transform,opacity}
#city{left:0;right:0;bottom:0;height:42vh;background-repeat:repeat-x;background-size:auto 100%;background-position:bottom}
#clouds{left:0;right:0;top:0;height:100vh;opacity:0}
.cl{position:absolute;width:34vmin;height:20vmin;background-size:contain;background-repeat:no-repeat;animation:drift 16s ease-in-out infinite alternate}
.cl:nth-child(even){animation-duration:23s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(10vw)}}
#stars{left:0;right:0;top:-20vh;height:140vh;opacity:0;background-size:300px 300px;animation:twinkle 3s infinite alternate}
#shoot{position:absolute;top:30%;right:-25vmin;width:22vmin;height:.7vmin;border-radius:1vmin;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 6s linear infinite}
@keyframes shoot{0%,72%{opacity:0;transform:translate(0,0) rotate(-28deg)}75%{opacity:1}100%{opacity:0;transform:translate(-130vw,62vh) rotate(-28deg)}}
#moon{right:9vw;top:7vh;width:30vmin;height:30vmin;opacity:0;background-size:contain}
@keyframes twinkle{from{filter:brightness(.7)}to{filter:brightness(1.3)}}
#pop{position:fixed;z-index:4;left:0;right:0;top:24vh;text-align:center;pointer-events:none}
.pw{position:absolute;left:0;right:0;font-size:11vmin;color:#fff;-webkit-text-stroke:1.5vmin var(--ink);paint-order:stroke fill;text-shadow:.9vmin .9vmin 0 var(--ink);animation:pw .95s forwards}
@keyframes pw{0%{transform:scale(.3) rotate(-14deg);opacity:0}18%{transform:scale(1.25) rotate(-5deg);opacity:1}35%{transform:scale(1) rotate(-3deg)}75%{opacity:1}100%{transform:translateY(-9vh) rotate(-3deg);opacity:0}}
#rays{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.75) 0 3deg,transparent 3deg 11deg);-webkit-mask-image:radial-gradient(circle at 50% 62%,transparent 28%,#000 75%);mask-image:radial-gradient(circle at 50% 62%,transparent 28%,#000 75%)}
#rays.on{animation:rays .5s ease-out}
@keyframes rays{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
.hide{display:none!important}
@keyframes nkDrop{0%{transform:translateY(-260px);opacity:0}14%{transform:translateY(0);opacity:1}18%{transform:translateY(-10px)}22%,78%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}
.nk{animation:nkDrop 3.2s infinite}
@media(prefers-reduced-motion:reduce){.nk,.cl,#logo,#shoot{animation:none}}
#load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:linear-gradient(#ff8fb8,#ffc2a8 55%,#fff0b8);transition:opacity .6s}
#load.gone{opacity:0;pointer-events:none}
#load svg{width:min(60vmin,420px);height:auto}
#ldTitle{font-size:11vmin;color:#fff;-webkit-text-stroke:1.4vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink)}
#ldBar{width:58vmin;height:3.4vmin;border:.8vmin solid var(--ink);border-radius:2vmin;background:var(--paper);overflow:hidden}
#ldFill{height:100%;width:0;background:var(--pink);transition:width .35s;position:relative;overflow:hidden}
#ldFill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:ldShine 1.2s linear infinite}
@keyframes ldShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#ldTxt{font-size:4.4vmin;text-align:center;padding:0 6vw}
#ldDev,#dev{bottom:calc(env(safe-area-inset-bottom,0px) + 2.5vh);left:0;right:0;text-align:center;font-size:3.6vmin;letter-spacing:.18em;color:#fff;-webkit-text-stroke:.6vmin var(--ink);paint-order:stroke fill;pointer-events:none}
#ldDev{position:absolute}
.nekCard{display:inline-block;vertical-align:middle;margin-left:1vmin;padding:.9vmin 2vmin .9vmin 2vmin;background:var(--sun);color:var(--ink);font-size:3.8vmin;-webkit-text-stroke:0;text-shadow:none;transform:rotate(-2deg);pointer-events:none}
#dev{position:fixed;z-index:3;transition:opacity .5s}
#menu.out~#dev{opacity:0}
#pauseBox{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:2vh;width:56vw;max-width:380px}
#pauseBox>*{padding:1.6vh 0;font-size:6.4vmin;flex:none}
#pauseT{background:var(--sun)}
#fl{left:0;right:0;top:0;bottom:0}
#achInfo{flex:5;font-size:2.9vmin;white-space:pre-line;display:flex;align-items:center;justify-content:center;line-height:1.25;padding:0 2vw}
#fl i{position:absolute;bottom:-3vh;background:#fff;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.85}90%{opacity:.6}to{transform:translateY(-108vh) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:reduce){#fl i{animation:none}}
#bkIn{flex:1;font-size:4vmin;min-width:0;outline:none}
#helpInfo{font-size:2.8vmin;flex:5}
#misInfo{font-size:2.9vmin;flex:5}
#achInfo{font-size:2.6vmin}
#tmr{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 1.2vh);right:3vw;font-size:7vmin;color:#fff;-webkit-text-stroke:.9vmin var(--ink);paint-order:stroke fill;pointer-events:none}
#nov{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:72vw;max-width:480px;padding:2.5vh 4vw;display:flex;flex-direction:column;gap:2vh}
#novT{white-space:pre-line;font-size:4.2vmin;line-height:1.3;text-align:left}
#nov .btn{flex:none;padding:1.2vh 0;font-size:6vmin;background:var(--pink)}
#snow{left:0;right:0;top:0;bottom:0;opacity:0}
#snow i{position:absolute;top:-4vh;background:#fff;border-radius:50%;animation:fall linear infinite}
@keyframes fall{to{transform:translate(4vw,108vh)}}
@media(prefers-reduced-motion:reduce){#snow i{animation:none}}
#rankInfo,#amigInfo{flex:5;font-size:2.8vmin;white-space:pre-line;display:flex;align-items:center;justify-content:center;line-height:1.3;padding:0 2vw}
#nickIn,#frIn{flex:1;font-size:4.4vmin;min-width:0;outline:none}
/* telas largas: lista rola e os botões ficam sempre visíveis */
#menu.wide{left:5vw;width:90vw;max-width:560px;top:calc(env(safe-area-inset-top,0px) + 3vh);height:calc(100vh - 8vh - env(safe-area-inset-top,0px))}
#menu.wide #logo{display:none}
#menu.wide .btn,#menu.wide input{flex:none;height:8.5vh;min-height:48px;font-size:min(6vmin,34px)}
#menu.wide~#dev{opacity:0}
#logo small{white-space:pre-line;line-height:1.3}
#roomInfo,#misInfo,#sknInfo,#helpInfo,#achInfo,#rankInfo,#amigInfo{flex:1 1 0;min-height:0;overflow-y:auto;display:block;filter:none;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:700;letter-spacing:0;font-size:clamp(14px,3.5vmin,21px);line-height:1.5;text-align:left;padding:1.6vh 4vw;white-space:pre-line}
#nickIn,#frIn,#bkIn{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:700;letter-spacing:0}
#frIn{text-transform:uppercase}
#novT{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:700;letter-spacing:0;font-size:clamp(14px,3.8vmin,22px)}
#nov,#tip{filter:none}
/* tela do baú */
#bau{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 4vh) 6vw calc(env(safe-area-inset-bottom,0px) + 4vh);pointer-events:none}
#bau>*{pointer-events:auto}
#bauTit{font-size:11vmin;color:#fff;-webkit-text-stroke:1.4vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink);pointer-events:none}
#bauBot{display:flex;flex-direction:column;gap:2vh;width:min(84vw,400px)}
#bauMsg,#rodaRes{filter:none;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:700;letter-spacing:0;font-size:clamp(15px,4vmin,22px);padding:1.4vh 4vw;white-space:pre-line}
#bauBot .btn,#roda .btn{flex:none;padding:1.5vh 0;font-size:6.2vmin}
#roda{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2vh;width:min(88vw,52vh,420px)}
#rodaBox{position:relative;width:100%}
#rodaSvg{width:100%;display:block}
#rodaPin{position:absolute;top:-4.5vmin;left:50%;transform:translateX(-50%);font-size:9vmin;line-height:1;color:var(--pink);-webkit-text-stroke:.8vmin var(--ink);paint-order:stroke fill;z-index:1}
#roda .btn,#roda #rodaRes{width:100%}
/* modos como cartões */
#modoInfo{flex:none;filter:none;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:700;letter-spacing:0;font-size:clamp(14px,3.6vmin,21px);line-height:1.4;text-align:center;padding:1.4vh 4vw;white-space:pre-line}
#menu.wide .mod{height:12vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;filter:none}
.mod b{font-size:min(6.4vmin,36px);font-weight:400}
.mod small{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-weight:700;letter-spacing:0;font-size:clamp(12px,3.2vmin,18px)}
/* loja de skins: painel embaixo, skin aparece em cima */
#menu.wide.sk{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);height:auto}
#menu.sk #sknInfo{flex:none;height:auto;overflow:visible;padding:1.6vh 4vw}
#sknRow1,#sknRow2{display:flex;gap:2.5vw;flex:none;height:8.5vh}
#menu.wide #sknRow1 .btn,#menu.wide #sknRow2 .btn{flex:1;min-width:0;height:100%;font-size:min(5.6vmin,32px)}
.sn{display:flex;justify-content:space-between;align-items:baseline}
.sn b{font-family:Bangers,Impact,sans-serif;font-size:min(8vmin,44px);letter-spacing:.04em;font-weight:400}
.sn span{opacity:.6}
.sb{font-size:clamp(14px,3.6vmin,20px);margin:.4vh 0 1vh}
.sf{display:flex;justify-content:space-between;align-items:center;gap:2vw}
.sf .pr,.sf .ok{background:#ffd23f;border:.5vmin solid var(--ink);border-radius:2vmin;padding:.3vh 3vw}
.sf .ok{background:#9be3b0}
.sd{display:flex;gap:1.6vmin;justify-content:center;margin-top:1.4vh}
.sd i{width:2.4vmin;height:2.4vmin;border-radius:50%;border:.4vmin solid var(--ink);background:#fffdf5}
.sd i.own{background:#9be3b0}
.sd i.on{background:#ff7aa8;transform:scale(1.35)}
/* cartões de texto: fundo em cada linha pra ler melhor */
#misInfo,#helpInfo,#achInfo,#rankInfo,#amigInfo{white-space:normal;padding:1.2vh 3vw}
.sec{display:inline-block;background:#ffd23f;border:.5vmin solid var(--ink);border-radius:2vmin;padding:.4vh 3vw;margin:1.2vh 0 .6vh;font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.06em;font-size:clamp(15px,4.2vmin,24px)}
.row{display:flex;justify-content:space-between;align-items:center;gap:2vw;background:#fff;border:.4vmin solid var(--ink);border-radius:2vmin;padding:.9vh 3vw;margin:.7vh 0;font-size:clamp(14px,3.5vmin,20px);line-height:1.3}
.row em{font-style:normal;white-space:nowrap;background:#ffe9a8;border-radius:1.5vmin;padding:.2vh 2vw;font-size:.9em}
.row.done{background:#d9f7e2}.row.done em{background:#9be3b0}
.row.muted{background:#f1ede4;opacity:.85;justify-content:center}
.coins{font-size:clamp(16px,4.4vmin,26px);margin-bottom:.2vh}
.chips{display:flex;flex-wrap:wrap;gap:1.2vw;margin:.5vh 0}
.chips b,.chips span{background:#fff;border:.4vmin solid var(--ink);border-radius:2vmin;padding:.2vh 2.4vw;font-size:clamp(12px,3.1vmin,18px)}
.rk{display:flex;align-items:center;gap:2.5vw;background:#fff;border:.4vmin solid var(--ink);border-radius:2.4vmin;padding:.9vh 3vw;margin:.7vh 0;font-size:clamp(15px,3.9vmin,22px)}
.rk .pos{width:9vmin;text-align:center;font-size:1.15em}
.rk .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .nm em{font-style:normal;font-size:.7em;background:#ff7aa8;color:#fff;border-radius:1.4vmin;padding:.1vh 1.6vw;margin-left:1vw}
.rk .sc{background:#ffd23f;border:.4vmin solid var(--ink);border-radius:1.8vmin;padding:.1vh 2.6vw;min-width:9vmin;text-align:center}
.rk.me{background:#ffeaf2;border-width:.6vmin}
.aviso{padding:2vh 2vw;text-align:center;opacity:.8}
.meu{text-align:center;margin-top:1.2vh}
.cod{background:#fff;border:.5vmin dashed var(--ink);border-radius:2.4vmin;padding:1vh 3vw;text-align:center;cursor:pointer;margin-bottom:.4vh}
.cod small{display:block;font-size:clamp(11px,2.8vmin,16px);opacity:.7}
.cod b{display:block;font-family:Bangers,Impact,sans-serif;font-weight:400;font-size:clamp(26px,8vmin,44px);letter-spacing:.2em}
#rkRow1,#rkRow2,#frRow{display:flex;gap:2.5vw;flex:none;height:8.5vh}
#menu.wide #rkRow1 input,#menu.wide #frRow input{flex:1.6;min-width:0;height:100%}
#menu.wide #rkRow1 .btn,#menu.wide #rkRow2 .btn,#menu.wide #frRow .btn{flex:1;min-width:0;height:100%;font-size:min(5.6vmin,32px)}
/* loja de skins compacta: o bloco fica visível em cima */
#bauTop{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 2vh);right:4vw;padding:1vh 4vw;font-size:5vmin;background:var(--sun);flex:none}
#menu.sk #sknRow1{display:contents}
#menu.wide #sknRow1 #sknPrev,#menu.wide #sknRow1 #sknNext{position:fixed;top:30vh;width:15vw;height:15vw;max-width:88px;max-height:88px;min-height:0;padding:0;font-size:7vmin;z-index:4;flex:none}
#menu.wide #sknRow1 #sknPrev{left:2vw}
#menu.wide #sknRow1 #sknNext{right:2vw}
#sknRow2{height:7.2vh}
#menu.wide #sknRow2 .btn{font-size:min(4.6vmin,26px)}
#menu.wide.sk #sknBack{height:7.2vh;min-height:44px}
#menu.sk #sknInfo{padding:1.1vh 4vw}
.sn b{font-size:min(7vmin,40px)}
.sb{font-size:clamp(13px,3.3vmin,19px);margin:.2vh 0 .8vh}
.sf{flex-wrap:wrap}

// Torre da tela de carregamento (gerada por código, mais leve)
(function(){
  const I='#1b1a3a',f=(p,hu,l,s)=>`<polygon points="${p.join(' ')}" fill="hsl(${hu},${s}%,${l}%)" stroke="${I}" stroke-width="6" stroke-linejoin="round"/>`;
  let g='<ellipse cx="200" cy="382" rx="130" ry="22" fill="#1b1a3a" fill-opacity=".25"/>',cy=300;
  [[110,262],[95,300],[80,335],[66,10]].forEach(([w,hu],i)=>{
    const ty=cy-w/2,h=34,T=[[200,ty],[200+w,ty+w/2],[200,ty+w],[200-w,ty+w/2]],L=[[200-w,ty+w/2],[200,ty+w],[200,ty+w+h],[200-w,ty+w/2+h]],R=[[200,ty+w],[200+w,ty+w/2],[200+w,ty+w/2+h],[200,ty+w+h]];
    let x='';
    if(i===3)x=`<polygon points="${200-w+8},${ty+w/2} ${200-w+10},${ty-34} ${200-w+44},${ty+w/2-14}" fill="hsl(10,80%,80%)" stroke="${I}" stroke-width="6" stroke-linejoin="round"/><polygon points="${200+w-8},${ty+w/2} ${200+w-10},${ty-34} ${200+w-44},${ty+w/2-14}" fill="hsl(10,80%,80%)" stroke="${I}" stroke-width="6" stroke-linejoin="round"/><ellipse cx="${200-w*.45}" cy="${ty+w*.75+h*.3}" rx="9" ry="14" fill="${I}"/><ellipse cx="${200+w*.45}" cy="${ty+w*.75+h*.3}" rx="9" ry="14" fill="${I}"/>`;
    g+=`<g class="nk" style="animation-delay:${i*.45}s">${f(L,hu,64,65)}${f(R,hu,52,60)}${f(T,hu,80,80)}${x}</g>`;cy-=h;
  });
  document.getElementById('ldSvg').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">'+g+'</svg>';
})();
// Progresso REAL: cada parte só conta quando de fato terminou
const Load=(()=>{
  const nomes={motor:'motor 3D',fonte:'fonte do menu',cena:'cena e shaders',imagem:'primeira imagem'};

  return{
    done(k){feitos.add(k);ui();if(feitos.size===total)setTimeout(()=>{g('load').classList.add('gone');setTimeout(()=>g('load').remove(),700)},Math.max(150,MIN_MS-performance.now()));},
    fail(m){g('ldTxt').textContent=m;g('ldRetry').classList.remove('hide');g('ldFill').style.background='#e0405a';},ui
  };
})();

<script>
var ad=false; // <<< ANÚNCIOS: false = desligado (nada de anúncio aparece) · true = ligado (reviver + skins)
const GAME_V=19; // aumente a cada versão nova
const $=id=>document.getElementById(id);
const H=.6,BASE=3,LIM=3.10,TOL=.12,MENU_SHIFT=.4,VIEW=2.2,VEL=3.45; // VEL = velocidade fixa dos blocos
const INIT=8; // blocos já empilhados quando a partida começa (como no Stack)

// ---- Salvamento e opções (guardados no aparelho) ----
const SAVE_KEY='nekoTowerSave';
let sv={moedas:0,donos:[0],skin:0,dia:'',ids:[],prog:{},pegas:{},tips:{},opt:null,ach:{},st:{perf:0,jogos:0,score:0,combo:0}};
try{Object.assign(sv,JSON.parse(localStorage.getItem(SAVE_KEY))||{});}catch(e){}
let svT=0;
const salvarJa=()=>{svT=0;try{localStorage.setItem(SAVE_KEY,JSON.stringify(sv));}catch(e){}};
const salvar=()=>{if(!svT)svT=setTimeout(salvarJa,900);}; // várias gravações seguidas viram uma só
const salvarAgora=()=>{if(svT){clearTimeout(svT);salvarJa();}};
addEventListener('pagehide',salvarAgora);document.addEventListener('visibilitychange',()=>{if(document.hidden)salvarAgora();});
const cfg={som:true,mus:true,vib:true,gfx:1};
if(sv.opt)Object.assign(cfg,sv.opt);
const saveOpt=()=>{sv.opt={som:cfg.som,mus:cfg.mus,vib:cfg.vib,gfx:cfg.gfx};salvar();};
let best=0;try{best=+localStorage.getItem('stackBest')||0;}catch(e){}
const vib=p=>{if(cfg.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

// ---- Motor Babylon ----
const eng=new BABYLON.Engine($('c'),true,{alpha:true,antialias:true,powerPreference:'high-performance'});
const scene=new BABYLON.Scene(eng);
scene.clearColor=new BABYLON.Color4(0,0,0,0);
scene.skipPointerMovePicking=true;scene.autoClear=true;
const RIG=new BABYLON.Vector3(14,19.8,-14);
const cm=new BABYLON.FreeCamera('cm',RIG.clone(),scene);
cm.setTarget(BABYLON.Vector3.Zero());cm.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;cm.minZ=.1;cm.maxZ=100;

// Shader toon: 3 faixas de luz, hachura e uma "pele" para cada skin (0 a 7) + brilho de frenesi
BABYLON.Effect.ShadersStore.toonVertexShader=`precision highp float;attribute vec3 position;attribute vec3 normal;attribute vec4 color;uniform mat4 world;uniform mat4 worldViewProjection;varying vec3 vN;varying vec4 vC;varying vec3 vP;varying float vY;
void main(){vN=normalize((world*vec4(normal,0.)).xyz);vC=color;vP=position;vY=(world*vec4(position,1.)).y;gl_Position=worldViewProjection*vec4(position,1.);}`;
BABYLON.Effect.ShadersStore.toonFragmentShader=`precision highp float;varying vec3 vN;varying vec4 vC;varying vec3 vP;varying float vY;uniform vec3 L;uniform float hatch;uniform float skin;uniform float time;uniform float fever;uniform float fogA;uniform float fogB;uniform vec3 fogC1;uniform vec3 fogC2;uniform vec3 fogC3;uniform float uH;uniform float bh;
void main(){
  float d=dot(normalize(vN),normalize(L));
  float b=d>.7?1.:d>.3?.8:.62;
  vec3 col=vC.rgb;float s=floor(skin+.5);bool top=vN.y>.5;float gl=0.;
  if(s==1.){if(mod((vP.x+vP.z+vP.y*2.)*2.6,1.)<.5)col=mix(col,vec3(1.),.6);}
  else if(s==2.){col=top?vec3(1.,.56,.44):vec3(.98,.96,.9);if(!top&&abs(vP.y)<bh*.2)col=vec3(.1,.2,.15);}
  else if(s==3.){bool rib=(abs(vN.x)>.5&&abs(vP.z)<.16)||(abs(vN.z)>.5&&abs(vP.x)<.16)||(top&&(abs(vP.x)<.16||abs(vP.z)<.16));if(rib)col=vec3(1.,.82,.24);}
  else if(s==4.){vec3 q=floor(vP/.3);if(mod(q.x+q.y+q.z,2.)<1.)col*=.86;col=floor(col*5.)/5.;}
  else if(s==5.){vec3 g=col;col=vec3(.07,.06,.16);if(abs(vP.y)>bh*.38||(top&&(mod(vP.x*3.,1.)<.09||mod(vP.z*3.,1.)<.09))){col=g;gl=1.;}}
  else if(s==6.){col=mix(vec3(.12,.06,.3),col*.75,.35+.3*sin(vP.x*3.+vP.z*2.+time));vec3 q=floor(vP*9.);float h=fract(sin(dot(q,vec3(12.9,78.2,37.7)))*43758.5);if(h>.93){col=vec3(1.,.97,.8)*(.75+.25*sin(time*4.+h*50.));gl=1.;}}
  else if(s==7.){col=vec3(1.,.78,.2);col=mix(col,vec3(1.,.97,.75),smoothstep(.8,1.,sin((vP.x+vP.z+vP.y*2.)*3.-time*2.5)));}
  else if(s==8.){col=mix(vec3(.62,.88,1.),vec3(1.),smoothstep(.7,1.,sin(vP.x*8.+vP.z*6.+vP.y*4.)));}
  else if(s==9.){col=.55+.45*cos(6.2832*(vec3(0.,.33,.67)+(vP.x+vP.z)*.25+vP.y*1.5+time*.15));}
  else if(s==12.){ // manga: tinta preta pesada, hachura e cortes de espada (1 bloco branco a cada 3 pretos)
    float t=vC.r;bool fx=abs(vN.x)>.5,kk=t<.94;
    vec2 uv=top?vP.xz:(fx?vP.zy:vP.xy);
    float ink=kk?1.:0.;
    float hl=mod((uv.x+uv.y)*(fx?9.:7.),1.);
    if(!top){
      if(kk){if(!fx&&hl<.1)ink=0.;}
      else if(hl<(fx?.3:.13))ink=1.;
      if(uv.y>.25)ink=kk?0.:1.;
    }
    float sl=t>.94?.55:t>.81?-.6:t>.67?.5:-.5;
    float u0=t>.94?-.35:t>.81?.3:t>.67?-.2:.4;
    float dx=uv.x-u0,ax=abs(dx),Ln=top?1.3:.75,sq=sqrt(1.+sl*sl);
    if(ax<Ln&&abs(uv.y-sl*dx)/sq<(top?.05:.034)*(1.-ax/Ln))ink=1.-ink;
    float L2=Ln*.55;
    if(ax<L2&&abs(uv.y-sl*dx-(top?.35:.16))/sq<.013*(1.-ax/L2))ink=1.-ink;
    col=vec3(1.-ink);gl=1.;
  }
  else if(s==10.){if(abs(vP.y)>bh*.4)col*=.45;}
  else if(s==11.){if(mod((vP.x+vP.z+vP.y*2.)*3.,1.)<.5)col=mix(col,vec3(1.),.7);}
  if(s!=12.)col+=fever*.16*vec3(sin(time*5.+vP.y*9.),sin(time*5.+2.+vP.y*9.),sin(time*5.+4.+vP.y*9.));
  vec3 c=clamp(col,0.,1.)*(gl>0.?1.:b);
  if(!top&&s!=12.)c*=.9+.1*smoothstep(-bh*.5,bh*.5,vP.y); // degradê suave nas laterais
  float tf=smoothstep(fogB,fogA,vY);                 // 1 = sem neblina, 0 = dentro da neblina
  float sy=1.-gl_FragCoord.y/uH;                     // posição na tela (0 = topo)
  vec3 fc=sy<.62?mix(fogC1,fogC2,sy/.62):mix(fogC2,fogC3,(sy-.62)/.38); // cor do céu nesse ponto
  c=mix(fc,c,smoothstep(0.,.55,tf));                 // primeiro vira cor do céu...
  float al=smoothstep(0.,.45,tf);                    // ...e só no fim fica transparente
  gl_FragColor=vec4(c*al,al);
}`;
const toon=new BABYLON.ShaderMaterial('toon',scene,'toon',{attributes:['position','normal','color'],uniforms:['world','worldViewProjection','L','hatch','skin','time','fever','fogA','fogB','fogC1','fogC2','fogC3','uH','bh']});
toon.setVector3('L',new BABYLON.Vector3(.1,.8,-.6));toon.setFloat('fogA',-1e4);toon.setFloat('fogB',-10001);toon.setFloat('uH',1);toon.setFloat('bh',H);
const INK=BABYLON.Color3.FromHexString('#1b1a3a');

const DPR=Math.min(devicePixelRatio||1,2.5);
const GFX=[
  {nome:'Baixo',scale:1.25,line:false,ow:.03,hatch:0,desc:'Baixo: mais rápido, ideal p/ celular fraco'},
  {nome:'Médio',scale:1/Math.min(DPR,2),line:true,ow:.022,hatch:0,desc:'Médio: nítido e equilibrado'},
  {nome:'Ultra',scale:1/DPR,line:true,ow:.018,hatch:0,desc:'Ultra: máxima nitidez, gasta mais bateria'}
];
const Q=()=>GFX[cfg.gfx];
function applyGfx(){
  const q=Q();eng.setHardwareScalingLevel(q.scale);toon.setFloat('hatch',q.hatch);
  scene.meshes.forEach(m=>{m.renderOutline=q.line&&m.name.indexOf('ring')!==0;m.outlineWidth=q.ow;m.outlineColor=INK;});
  $('gfx').textContent='Gráfico: '+q.nome;
}
applyGfx();

function mk(x,z,w,d,y,hue){
  const c3=skinColor(Math.round(y/H),hue),c=new BABYLON.Color4(c3.r,c3.g,c3.b,1);
  const m=BABYLON.MeshBuilder.CreateBox('b',{width:w,height:H,depth:d,faceColors:[c,c,c,c,c,c]},scene);
  m.position.set(x+w/2,y+H/2,z+d/2);m.material=toon;m.isPickable=false;
  m.renderOutline=Q().line;m.outlineWidth=Q().ow*(skinI===12?1.8:1);m.outlineColor=skinI===12?BABYLON.Color3.Black():INK;
  return m;
}

// ---- Efeitos 3D: partículas de estrelinhas e anel de onda no encaixe perfeito ----
const ptx=new BABYLON.DynamicTexture('pt',64,scene,false),px=ptx.getContext();
px.fillStyle='#fff';px.beginPath();for(let i=0;i<10;i++){const r=i%2?11:29,a=i*Math.PI/5-Math.PI/2;px.lineTo(32+r*Math.cos(a),32+r*Math.sin(a));}px.fill();ptx.hasAlpha=true;ptx.update();
const ps=new BABYLON.ParticleSystem('fx',160,scene);
ps.particleTexture=ptx;ps.emitter=new BABYLON.Vector3();ps.emitRate=0;
ps.color1=new BABYLON.Color4(1,.82,.25,1);ps.color2=new BABYLON.Color4(1,.48,.66,1);ps.colorDead=new BABYLON.Color4(1,1,1,0);
ps.minSize=.16;ps.maxSize=.4;ps.minLifeTime=.45;ps.maxLifeTime=.95;ps.gravity=new BABYLON.Vector3(0,-8,0);
ps.direction1=new BABYLON.Vector3(-2.5,3,-2.5);ps.direction2=new BABYLON.Vector3(2.5,6,2.5);
ps.minAngularSpeed=-4;ps.maxAngularSpeed=4;ps.blendMode=BABYLON.ParticleSystem.BLENDMODE_STANDARD;ps.start();
const mkT=f=>{const t=new BABYLON.DynamicTexture('pt',64,scene,false),x=t.getContext();x.fillStyle=x.strokeStyle='#fff';f(x);t.hasAlpha=true;t.update();return t;};
const PTX=[ptx,mkT(x=>{x.beginPath();x.moveTo(32,54);x.bezierCurveTo(4,34,10,8,32,22);x.bezierCurveTo(54,8,60,34,32,54);x.fill();}),mkT(x=>{x.beginPath();x.arc(32,32,20,0,7);x.fill();}),mkT(x=>{x.fillRect(14,14,36,36);}),mkT(x=>{x.lineWidth=7;x.lineCap='round';for(let i=0;i<3;i++){const a=i*Math.PI/3;x.beginPath();x.moveTo(32+26*Math.cos(a),32+26*Math.sin(a));x.lineTo(32-26*Math.cos(a),32-26*Math.sin(a));x.stroke();}})];
const FXMAP={1:1,2:2,3:2,4:3,5:3,8:4,9:2,10:3,11:4}; // efeito de encaixe de cada skin
// Rastro de brilhos atrás do bloco em movimento
const OFF=new BABYLON.Vector3(0,-999,0),trail=new BABYLON.ParticleSystem('trail',80,scene);

function eyeTexCanvas(mirror){
  const c=document.createElement('canvas');c.width=256;c.height=192;
  const x=c.getContext('2d');
  if(mirror){x.translate(256,0);x.scale(-1,1);}
  const X=u=>24+u*208,Y=v=>22+v*140;
  x.lineJoin='round';x.lineCap='round';x.strokeStyle='#38f5da';x.shadowColor='#38f5da';
  const draw=()=>{x.beginPath();x.moveTo(X(0),Y(.03));x.lineTo(X(1),Y(.66));x.bezierCurveTo(X(.88),Y(.92),X(.45),Y(1.1),X(.13),Y(.86));x.bezierCurveTo(X(.03),Y(.72),X(0),Y(.3),X(0),Y(.03));x.closePath();x.stroke();};
  x.lineWidth=15;x.shadowBlur=22;draw();   // brilho
  x.lineWidth=9;x.shadowBlur=6;draw();     // traço
  return c;
}

const mgEyeMats={};
function mgEyeMat(mirror){
  if(mgEyeMats[mirror])return mgEyeMats[mirror];
  const tx=new BABYLON.DynamicTexture('eyet',{width:256,height:192},scene,false);
  tx.getContext().drawImage(eyeTexCanvas(mirror),0,0);tx.hasAlpha=true;tx.update();
  const m=new BABYLON.StandardMaterial('eyem'+(mirror?1:0),scene);
  m.diffuseTexture=tx;m.useAlphaFromDiffuseTexture=true;m.disableLighting=true;m.backFaceCulling=false;
  return mgEyeMats[mirror]=m;
}

async function joinRoom(code,host){

  const pl=mode==='play'&&!net.active&&!paused;if(pl!==plAnt){plAnt=pl;$('pz').classList.toggle('hide',!pl);Mus.mood(pl);}

  const tv=modo==='relogio'&&(mode==='play'||mode==='pan');if(tv!==tmrAnt){tmrAnt=tv;$('tmr').classList.toggle('hide',!tv);}
  if(tv){const ts=Math.ceil(tmpR);if(ts!==tsAnt){tsAnt=ts;$('tmr').textContent='⏱ '+ts;}}

  if(mode==='pan'){
    const p=Math.min((performance.now()-panT0)/1000,1),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    shift=MENU_SHIFT*(1-e);zoom=1.18-.18*e;
    if(p>=1){mode='play';if(net.active)net.t0=performance.now();tip('t1','👆 Toque na tela para soltar o bloco!');}
  }
  if(mv&&(mode==='menu'||mode==='pan'||mode==='play')){
    if(skinOn&&mode==='menu'){mv[mv.axis]=stack[stack.length-1][mv.axis];} // na loja o bloco fica parado em cima da torre
    else{
      mv[mv.axis]+=mv.dir*mv.speed*dt;
      const hs=(mv.axis==='x'?mv.w:mv.d)/2,cc=mv[mv.axis]+hs; // posição do centro do bloco
      if(cc>LIM){mv[mv.axis]=LIM-hs;mv.dir=-1;}
      if(cc<-LIM){mv[mv.axis]=-LIM-hs;mv.dir=1;}
    }
    mv.mesh.position.x=mv.x+mv.w/2;mv.mesh.position.z=mv.z+mv.d/2;
    const c=mv.mesh.cat;
    if(c){const bl=now%3.4<.13;c.eyes.forEach(e=>e.scaling.y=e._by*mood*(bl?.12:1));c.ears.forEach((e,i)=>e.rotation.z=Math.sin(now*5+i*2)*.1);}
  }
  debris.forEach(b=>{b.vy+=14*dt;b.mesh.position.y-=b.vy*dt;});
  for(let i=debris.length-1;i>=0;i--){const b=debris[i];if(b.mesh.position.y<=camY-7){b.mesh.dispose();debris.splice(i,1);}}
  if(popM&&!popM.isDisposed()){const p=Math.max(pop,0);popM.scaling.set(1+.12*p,1-.2*p,1+.12*p);pop-=dt*4;if(pop<=0){popM.scaling.set(1,1,1);popM.freezeWorldMatrix();popM=null;}}
  if(ringT>0){ringT-=dt*2.2;const k=1-Math.max(ringT,0),s=ringB*(1+k*1.3);ring.scaling.set(s,1,s);rm.alpha=Math.max(ringT,0)*.9;if(ringT<=0)ring.isVisible=false;}
  mood+=(1-mood)*Math.min(dt*.6,1);
  fev+=((combo>=5?1:0)-fev)*Math.min(dt*3,1);
  toon.setFloat('time',now%600);toon.setFloat('fever',fev);mgTick();
  const cs=Math.floor(now);if(cs!==cullT){cullT=cs;if(mode!=='over')cull();}

  // Câmera: sobe com a torre; no fim de jogo afasta para mostrar a torre inteira
  skinK+=((skinOn?1:0)-skinK)*Math.min(dt*6,1);
  const asp=eng.getRenderWidth()/eng.getRenderHeight(),hh0=Math.max(3.4,VIEW/asp)*zoom*(1+.5*skinK),ov=mode==='over'&&stack.length>=12;
  overK+=((ov?Math.max(1,(stack.length*H*.42+1.5)/hh0):1)-overK)*Math.min(dt*2.5,1);
  const hh=hh0*overK*(1-.035*Math.max(punch,0)),hw=hh*asp;
  camY+=((ov?stack.length*H/2-.34*hh:(stack.length-camBase>=3?stack.length:camBase)*H)-camY)*Math.min(dt*5,1); // a tela só começa a subir no 3º bloco colocado

  scenery(ov?stack.length:camY/H);
  const sx=0,sy=0;

  cm.orthoTop=hh*(1.24-.74*skinK)+sy;cm.orthoBottom=-hh*(.76+.74*skinK)+sy;
  const sh=shift*(1-skinK);cm.orthoLeft=-hw-sh*hw+sx;cm.orthoRight=hw-sh*hw+sx;
  if(bauOn)bauFrame(dt,now);
  scene.render();
  if(frames<2&&++frames===2){Load.done('imagem');try{localStorage.setItem('nekoTry',0)}catch(e){}}
  // Auto-otimização: se o celular engasgar, baixa o gráfico sozinho
  if(mode==='play'&&frames>=2){fpsT+=dt;if(++fpsN>=150){if(fpsT/fpsN>.036&&cfg.gfx>0){cfg.gfx--;applyGfx();saveOpt();popText('Gráfico reduzido p/ ficar liso',2,6,12);}fpsT=fpsN=0;}}
});

let tab='in',busy=false,expired=false,pulled=false,booting=false,loggingOut=false,lastJ='',lastUp=0;
const fbU=()=>{try{return Rank.db&&firebase.auth().currentUser;}catch(e){return null;}};

function erro(e){

    'auth/missing-password':'Digite a senha',

    'auth/operation-not-allowed':'Login por e-mail não está ativado no Firebase',
    'PERMISSION_DENIED':'Sem permissão na nuvem (confira as regras do banco)'
  })[c]||(c==='rede'?'Sem conexão com a internet':'Algo deu errado'+(c?' ('+c+')':''));
}

// ---------------- Juntar progresso (aparelho + nuvem) ----------------
const uni=(a,b)=>[...new Set([...(a||[]),...(b||[])])];
function merge(l,c){
  const lx=l.xp||0,cx=c.xp||0,base=lx>=cx?l:c,oth=base===l?c:l,o=Object.assign({},oth,base);
  o.xp=Math.max(lx,cx);
  o.donos=uni(l.donos,c.donos);
  o.ach=Object.assign({},c.ach,l.ach);
  const s={};['perf','jogos','score','combo','tempo'].forEach(k=>s[k]=Math.max((l.st||{})[k]||0,(c.st||{})[k]||0));o.st=s;
  ['bestR','rkBest','rkPend','streak'].forEach(k=>o[k]=Math.max(l[k]||0,c[k]||0));
  const am=[...(c.amigos||[])];(l.amigos||[]).forEach(f=>{if(!am.some(x=>x.u===f.u))am.push(f);});o.amigos=am;
  o.nick=c.nick||l.nick;o.code=c.code||l.code;
  if(!o.donos.includes(o.skin))o.skin=0;
  return o;
}
function ahead(c,cb){
  return (c.xp||0)>(sv.xp||0)||(cb||0)>best||(c.donos||[]).some(x=>sv.donos.indexOf(x)<0)||Object.keys(c.ach||{}).some(k=>!sv.ach[k]);
}
function aplica(o,cb){
  Object.assign(sv,o);best=Math.max(best,cb||0);
  try{localStorage.setItem('stackBest',best);}catch(e){}
  salvarJa();
}

// ---------------- Nuvem ----------------
async function up(force){
  if(!sv.acc||!pulled)return false;
  if(navigator.onLine===false){setSt('☁ Sem internet — salvo só neste aparelho');return false;}
  if(!Rank.db)await Rank.carrega();
  const u=fbU();if(!u||u.isAnonymous)return false;
  const j=JSON.stringify(sv)+'|'+best;
  if(!force&&j===lastJ)return true;
  await Rank.db.ref('saves/'+u.uid).set({d:JSON.stringify(sv),b:best,t:firebase.database.ServerValue.TIMESTAMP});
  lastJ=j;lastUp=Date.now();stOk();return true;
}
async function boot(){ // 1x por abertura: puxa a nuvem antes de começar a enviar (evita sobrescrever com dado velho)
  if(!sv.acc||booting||pulled||expired||navigator.onLine===false)return;
  booting=true;
  try{
    await Rank.carrega();
    const u=fbU();
    if(!u||u.isAnonymous){expired=true;return;}
    const c=(await Rank.db.ref('saves/'+u.uid).once('value')).val();
    if(c&&c.d){
      const cl=JSON.parse(c.d);
      if(ahead(cl,c.b)){aplica(merge(sv,cl),c.b);if(typeof mode!=='undefined'&&mode==='menu'){location.reload();return;}if(typeof idleStatus==='function')idleStatus();}
    }
    pulled=true;up().catch(()=>{});
  }catch(e){}finally{booting=false;}
}

// ---------------- Telas ----------------
function setTab(t){
  tab=t;const n=t==='new';
  document.querySelectorAll('#accTabs .axb').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  g('accNick').classList.toggle('hide',!n);g('accPass2').classList.toggle('hide',!n);g('accForgot').classList.toggle('hide',n);
  g('accPass').autocomplete=n?'new-password':'current-password';
  g('accHint').textContent=n?'Guarde progresso, moedas e skins na nuvem e jogue em qualquer aparelho.':'Entre pra recuperar seu progresso.';
  setBusy(false);setMsg('');
}
function renderLogged(){
  const n=niv();
  g('accWho').innerHTML='<div class="axn">'+esc(sv.nick||'Jogador')+'</div><div class="axc" style="margin-top:1vh"><span>'+esc(sv.acc.e)+'</span></div><div class="axc" style="margin-top:.8vh"><b>Nv '+n+'</b><span>'+esc(TIT[Math.min(n-1,TIT.length-1)])+'</span><span>🪙 '+sv.moedas+'</span></div>';
  stOk();
}
function render(){
  const logged=!!sv.acc&&!expired;
  g('accOut').classList.toggle('hide',logged);g('accLog').classList.toggle('hide',!logged);
  g('accTit').textContent=logged?'MINHA CONTA':'CONTA';
  if(logged)renderLogged();else if(sv.acc&&!g('accMail').value)g('accMail').value=sv.acc.e;
}
async function verify(){
  setSt('☁ Conectando...');
  try{
    await Rank.carrega();
    const u=fbU();
    if(!u||u.isAnonymous){expired=true;render();setTab('in');setMsg('Sua sessão expirou. Entre de novo.','err');return;}
    await boot();render();
  }catch(e){setSt('☁ Sem conexão — salvo só neste aparelho');}
}
function open(){
  if(typeof mode!=='undefined'&&mode!=='menu')return;
  g('acc').classList.remove('hide');setTab('in');render();
  if(sv.acc&&!expired)verify();
}
function close(){g('acc').classList.add('hide');if(typeof idleStatus==='function')idleStatus();}

// ---------------- Criar conta / Entrar ----------------
async function criar(nick,email,pass){
  await Rank.carrega();
  const a=firebase.auth(),cred=firebase.auth.EmailAuthProvider.credential(email,pass),u=a.currentUser;
  if(u&&u.isAnonymous)await u.linkWithCredential(cred); // mantém o mesmo uid: ranking e progresso continuam
  else await a.createUserWithEmailAndPassword(email,pass);
  Rank.uid=a.currentUser.uid;
  sv.acc={e:email};sv.nick=nick;sv.rkOk=0;expired=false;pulled=true;salvarJa();
  try{await up(true);}catch(e){}
  Rank.sync();
}
async function entrar(email,pass){
  await Rank.carrega();
  const a=firebase.auth();
  await a.signInWithEmailAndPassword(email,pass);
  const u=a.currentUser;Rank.uid=u.uid;
  const c=(await Rank.db.ref('saves/'+u.uid).once('value')).val();
  if(c&&c.d)aplica(merge(sv,JSON.parse(c.d)),c.b);
  sv.acc={e:email};sv.rkOk=0;expired=false;pulled=true;salvarJa();
  try{await up(true);}catch(e){}
}

g('accForm').onsubmit=async ev=>{
  ev.preventDefault();if(busy)return;
  const email=g('accMail').value.trim().toLowerCase(),pass=g('accPass').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return setMsg('Digite um e-mail válido','err');
  if(pass.length<6)return setMsg('A senha precisa ter 6 ou mais caracteres','err');
  let nick='';
  if(tab==='new'){
    nick=g('accNick').value.replace(/[^\wÀ-ú -]/g,'').trim().slice(0,12);
    if(nick.length<2)return setMsg('O apelido precisa de pelo menos 2 letras','err');
    if(pass!==g('accPass2').value)return setMsg('As senhas não são iguais','err');
  }
  if(navigator.onLine===false)return setMsg('Sem internet','err');
  const novo=tab==='new';
  setBusy(true);setMsg(novo?'Criando sua conta...':'Entrando...');
  try{
    if(novo)await criar(nick,email,pass);else await entrar(email,pass);
    beep(784,.25);vib([15,30,15]);
    if(novo){setBusy(false);g('accPass').value=g('accPass2').value='';render();setMsg('Conta criada! Seu progresso já está na nuvem.','ok');}
    else{setMsg('Pronto! Carregando seu progresso...','ok');setTimeout(()=>location.reload(),900);}
  }catch(e){setMsg(erro(e),'err');beep(150,.2);vib(60);setBusy(false);}
};
g('accForgot').onclick=async()=>{
  const email=g('accMail').value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return setMsg('Digite seu e-mail acima primeiro','err');
  try{await Rank.carrega();await firebase.auth().sendPasswordResetEmail(email);setMsg('Enviamos um e-mail pra redefinir a senha. Olhe também o spam.','ok');}
  catch(e){setMsg(erro(e),'err');}
};
g('accEye').onclick=()=>{const t=g('accPass').type==='password'?'text':'password';g('accPass').type=t;g('accPass2').type=t;};
document.querySelectorAll('#accTabs .axb').forEach(b=>b.onclick=()=>setTab(b.dataset.t));

g('accSave').onclick=async()=>{
  setMsg('');setSt('☁ Salvando...');
  try{
    if(!pulled)await boot();
    if(!pulled)throw{code:'rede'};
    await up(true);setMsg('Salvo!','ok');vib(15);
  }catch(e){setSt('☁ Não salvou');setMsg(erro(e),'err');}
};
let lo=0;
g('accLogout').onclick=async()=>{
  const b=g('accLogout');
  if(!lo){
    b.textContent='Toque de novo pra sair';setMsg('Seu progresso fica salvo na nuvem. Neste aparelho ele será apagado.');
    lo=setTimeout(()=>{lo=0;b.textContent='Sair da conta';setMsg('');},3500);return;
  }
  clearTimeout(lo);lo=0;b.textContent='Salvando...';setMsg('');
  try{
    if(!pulled)await boot();
    if(!pulled)throw{code:'rede'};
    loggingOut=true;
    await up(true);
    await firebase.auth().signOut();
  }catch(e){loggingOut=false;b.textContent='Sair da conta';setMsg('Não consegui salvar na nuvem: '+erro(e)+'. Tente de novo.','err');return;}
  clearTimeout(svT);svT=0; // impede o jogo de regravar o save antigo
  try{localStorage.removeItem(SAVE);localStorage.removeItem('stackBest');}catch(e){}
  location.reload();
};

    try{
      const b=bridge(),am=admob();
      if(b&&b.showRewarded)ok=!!await b.showRewarded();
      else if(wv())ok=await viaH2A();
      else if(am)ok=await viaAdmob(am);
      else if(C.adsensePub)ok=await viaAdsense();
      else if(C.testMode)ok=await teste();
      else popText('Anúncio indisponível agora',2,6,8);
    }catch(e){popText('Anúncio indisponível agora',2,6,8);ok=false;}
    busy=false;try{if(musOn)Mus.start();}catch(e){}
    if(ok){sv.adDia=hoje();sv.adN=usados()+1;salvar();}
    return ok;
  }
  return {rewarded,disponivel,get busy(){return busy;},usados};
})();

// ---------- Reviver ----------
var Revive={used:false,tm:0};
function ReviveOffer(){ // chamado quando o jogador erra o bloco (no lugar de ir direto ao fim de jogo)
  if(!ad||net.active||Revive.used||score<5||!Ads.disponivel()||(modo!=='classico'&&modo!=='diario'))return gameOver();
  mode='revive';trail.emitRate=0;
  const d=document.createElement('div');d.id='rev';d.className='box';
  d.innerHTML='<div class="t">Quer continuar?</div><small>Veja um anúncio e volte a empilhar de onde parou.</small><button class="box btn go" id="revY">🎬 Reviver</button><button class="box btn" id="revN">Não, obrigado</button><div id="revBar"><i></i></div>';
  document.body.appendChild(d);
  const bar=d.querySelector('#revBar i'),t0=performance.now(),T=ADS_CFG.reviverSeg*1000;
  const fecha=()=>{clearInterval(Revive.tm);d.remove();};
  const nao=()=>{fecha();gameOver();};
  Revive.tm=setInterval(()=>{const k=1-(performance.now()-t0)/T;bar.style.transform='scaleX('+Math.max(k,0)+')';if(k<=0)nao();},60);
  d.querySelector('#revN').onclick=nao;
  d.querySelector('#revY').onclick=async()=>{
    clearInterval(Revive.tm);d.style.visibility='hidden';
    const ok=await Ads.rewarded();
    d.remove();
    if(ok){Revive.used=true;combo=0;hud();mode='play';spawn();beep(660,.2);vib(25);popText('Continue! 💖',2,8,8);}
    else{gameOver();}
  };
}

// ---------- Skins por anúncios ----------
function adsPara(s){return s.req||!s.preco?0:(s.preco<=250?ADS_CFG.anunciosBarato:ADS_CFG.anunciosCaro);}
var skAdBtn=document.createElement('button');skAdBtn.id='sknAd';skAdBtn.className='box btn hide';
if(ad)(function(){const b=document.getElementById('sknBack');if(b&&b.parentNode)b.parentNode.insertBefore(skAdBtn,b);})();
function adSkinUpd(){
  const s=SK[prev],dono=sv.donos.includes(prev),n=adsPara(s);
  if(!ad||dono||!n||!Ads.disponivel()){skAdBtn.classList.add('hide');return;}
  sv.adk=sv.adk||{};skAdBtn.classList.remove('hide');
  skAdBtn.textContent='🎬 Ganhar com anúncios ('+(sv.adk[prev]||0)+'/'+n+')';
}
skAdBtn.onclick=async()=>{
  const s=SK[prev],n=adsPara(s);if(!n||sv.donos.includes(prev)||Ads.busy)return;
  skAdBtn.disabled=true;
  const ok=await Ads.rewarded();skAdBtn.disabled=false;
  if(ok){
    sv.adk=sv.adk||{};sv.adk[prev]=(sv.adk[prev]||0)+1;
    if(sv.adk[prev]>=n){sv.donos.push(prev);delete sv.adk[prev];beep(660,.2);vib(25);popText('🎉 '+s.nome+' desbloqueada!',2,8,8);ach();}
    else popText('+1 anúncio! Faltam '+(n-sv.adk[prev]),2,7,8);
    salvar();
  }
  renderSkn();
};

</script>
<script>
/* ===== NEKO TOWER: compartilhar torre ===== */
var SHARE_CFG={url:'',titulo:'NEKO TOWER'}; // coloque o link do seu jogo/loja em url (ex.: 'https://seusite.com')
(function(){
  const st=document.createElement('style');
  st.textContent=`#shareB{position:fixed;z-index:4;right:4vw;top:calc(env(safe-area-inset-top,0px) + 9.5vh);padding:1vh 4vw;font-size:5vmin;background:var(--sun);flex:none;transform:rotate(1.5deg)}
#shareV{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;background:rgba(27,26,58,.92);padding:4vw;color:#fff;font:700 clamp(15px,4vmin,22px) system-ui,sans-serif;text-align:center}
#shareV img{max-width:80vw;max-height:56vh;border:.8vmin solid #1b1a3a;border-radius:2vmin;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#shareV .box{flex:none;padding:1vh 7vw;color:#1b1a3a;min-width:60vw}`;
  document.head.appendChild(st);
  const b=document.createElement('button');b.id='shareB';b.className='box btn hide';b.textContent='📤 Compartilhar';document.body.appendChild(b);
  const cv=()=>document.getElementById('c');
  function cartao(){
    scene.render(); // renderiza e copia no mesmo instante (o canvas 3D não guarda a imagem depois)
    const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const rs=getComputedStyle(document.documentElement),c1=rs.getPropertyValue('--c1').trim()||'#ffb3cf',c2=rs.getPropertyValue('--c2').trim()||'#ffd9c2',c3=rs.getPropertyValue('--c3').trim()||'#fff6d6';
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(.62,c2);g.addColorStop(1,c3);x.fillStyle=g;x.fillRect(0,0,W,H);
    const s=cv(),top=300,bot=1180,ah=bot-top,k=Math.max(W/s.width,ah/s.height),dw=s.width*k,dh=s.height*k;
    x.save();x.beginPath();x.rect(0,top,W,ah);x.clip();x.drawImage(s,(W-dw)/2,top+(ah-dh)/2,dw,dh);x.restore();
    const F="Bangers,'Dela Gothic One',Impact,sans-serif";
    x.textAlign='center';x.lineJoin='round';
    x.font='110px '+F;x.lineWidth=18;x.strokeStyle='#1b1a3a';x.fillStyle='#fff';x.strokeText(SHARE_CFG.titulo,W/2,150);x.fillText(SHARE_CFG.titulo,W/2,150);
    x.font='70px '+F;x.lineWidth=14;x.strokeText(score+' BLOCOS',W/2,250);x.fillStyle='#ffd23f';x.fillText(score+' BLOCOS',W/2,250);
    x.fillStyle='#1b1a3a';x.font='700 44px system-ui,sans-serif';
    x.fillText('Consegue me ganhar? 🐱',W/2,1245);
    const u=SHARE_CFG.url.replace(/^https?:\/\//,'');if(u){x.font='700 38px system-ui,sans-serif';x.fillText(u,W/2,1305);}
    return c;
  }
  const P=()=>{try{return window.parent&&window.parent!==window?window.parent:null;}catch(e){return null;}};
  const alvo=k=>{try{return window[k]||(P()&&P()[k])||null;}catch(e){return null;}};
  const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob);});
  const ehWV=()=>/\bwv\b|Flutter|InAppWebView/i.test(navigator.userAgent);
  let _shP=null;
  async function shareH2A(txt){ // compartilhar nativo do html2app (só texto/link; abre a lista com WhatsApp, Instagram etc.)
    if(!ehWV())return false;
    try{
      if(!_shP)_shP=import('https://cdn.jsdelivr.net/npm/@yandeu/js-bridge/lib/plugins/share.js/+esm').then(m=>m.Share);
      const S=await _shP;
      const r=await Promise.race([S.text(txt),new Promise(res=>setTimeout(()=>res('ok'),3000))]);
      return !(r&&r.ok===false);
    }catch(e){return false;}
  }
  function copiaTxt(t){
    try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;left:-9999px';document.body.appendChild(a);a.focus();a.select();const ok=document.execCommand('copy');a.remove();return ok;}catch(e){return false;}
  }
  function mostra(blob,txt){ // painel: torre grande (para tirar print) + compartilhar texto/link
    const v=document.createElement('div');v.id='shareV';const url=URL.createObjectURL(blob);
    v.innerHTML='<div>Sua torre está pronta! Tire um print desta tela para postar.</div><img src="'+url+'" alt="Minha torre"><button class="box btn" id="shW">📤 Compartilhar texto</button><button class="box btn" id="shC">📋 Copiar texto</button><button class="box btn" id="shX">Fechar</button><div id="shM" style="font-size:.85em;opacity:.85;min-height:1.2em"></div>';
    document.body.appendChild(v);const m=v.querySelector('#shM');
    v.querySelector('#shX').onclick=()=>{v.remove();URL.revokeObjectURL(url);};
    v.querySelector('#shW').onclick=async()=>{
      if(await shareH2A(txt))return;
      if(!ehWV()){try{window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');return;}catch(e){}}
      m.textContent=copiaTxt(txt)?'Texto copiado! Cole no WhatsApp ou no Instagram.':'Não consegui abrir o compartilhamento.';
    };
    v.querySelector('#shC').onclick=()=>{m.textContent=copiaTxt(txt)?'Texto copiado! Cole no WhatsApp ou no Instagram.':'Não deu para copiar.';};
  }
  async function enviar(blob,txt){
    const file=new File([blob],'neko-tower.png',{type:'image/png'});
    // 1) ponte do app nativo (se o seu APK expor NekoShareBridge.shareImage(base64,texto))
    const br=alvo('NekoShareBridge');
    if(br&&br.shareImage){await br.shareImage(await b64(blob),txt);return true;}
    // 2) Capacitor: Share + Filesystem
    const cap=alvo('Capacitor'),pl=cap&&cap.Plugins;
    if(pl&&pl.Share&&pl.Filesystem){
      const r=await pl.Filesystem.writeFile({path:'neko-tower.png',data:await b64(blob),directory:'CACHE'});
      await pl.Share.share({title:SHARE_CFG.titulo,text:txt,files:[r.uri],dialogTitle:'Compartilhar'});return true;
    }
    // 3) compartilhar do navegador (o jogo e, se for iframe, a página que o carrega)
    const navs=[navigator];try{if(P())navs.push(P().navigator);}catch(e){}
    for(const nv of navs){
      try{if(nv&&nv.canShare&&nv.canShare({files:[file]})){await nv.share({files:[file],text:txt,title:SHARE_CFG.titulo});return true;}}
      catch(e){if(e&&e.name==='AbortError')return true;}
    }
    return false;
  }
  b.onclick=async()=>{
    if(mode!=='over')return;b.disabled=true;
    try{
      const c=cartao(),blob=await new Promise(r=>c.toBlob(r,'image/png'));
      if(!blob)throw 0;
      const txt='Fiz '+score+' blocos no Neko Tower! 🐱 Consegue me ganhar?'+(SHARE_CFG.url?' '+SHARE_CFG.url:'');
      let ok=false;try{ok=await enviar(blob,txt);}catch(e){ok=false;}
      if(!ok)mostra(blob,txt);
    }catch(e){popText('Não deu para gerar a imagem',2,6,8);}
    b.disabled=false;
  };
  setInterval(()=>{const v=mode==='over'&&!net.active&&score>0&&!document.getElementById('shareV');b.classList.toggle('hide',!v);},300);
})();

</script>
