<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Neko Tower</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffb3cf">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link id="fontcss" rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Bangers&display=swap">
<style>
:root{--ink:#1b1a3a;--paper:#fffdf5;--pink:#ff7aa8;--sun:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:Bangers,Impact,sans-serif;color:var(--ink)}
body{background:linear-gradient(var(--c1,#ffb3cf),var(--c2,#ffd9c2) 62%,var(--c3,#fff6d6))}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;outline:none}
.box{background:var(--paper);border:.8vmin solid var(--ink);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;box-shadow:1.2vmin 1.2vmin 0 var(--ink);filter:url(#rough);text-align:center;letter-spacing:.06em;color:var(--ink);font-family:inherit;appearance:none;padding:0;margin:0}
#menu{position:fixed;z-index:3;left:5vw;top:calc(env(safe-area-inset-top,0px) + 6vh);width:42vw;max-width:340px;height:66vh;display:flex;flex-direction:column;gap:2.2vh;transition:transform .95s cubic-bezier(.65,-.25,.75,1)}
#menu.out{transform:translateX(-150%)}
.grp{display:contents}
#logo{flex:1.5;background:var(--sun);transform:rotate(-2deg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5vmin;line-height:.95;animation:bob 3.2s ease-in-out infinite}
#logo small{font-size:3.6vmin;letter-spacing:.08em;margin-top:.6vh}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-1vh) scale(1.03)}}
.btn{flex:1;font-size:6.6vmin;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .08s}
#play{background:var(--pink);transform:rotate(1.4deg)}
#cfg,#back{transform:rotate(-1deg)}
.btn:active{transform:translate(.8vmin,.8vmin);box-shadow:.3vmin .3vmin 0 var(--ink)}
.grp:not(.hide)>.box{animation:btnIn .5s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--i,0)*.07s)}
.grp>:nth-child(2){--i:1}.grp>:nth-child(3){--i:2}.grp>:nth-child(4){--i:3}.grp>:nth-child(5){--i:4}.grp>:nth-child(6){--i:5}
@keyframes btnIn{from{opacity:0;transform:translateX(-30vw) rotate(-6deg) scale(.8)}}
#score{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 3vh);left:0;right:0;text-align:center;font-size:19vmin;color:#fff;-webkit-text-stroke:1.6vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink);pointer-events:none;opacity:0;transition:opacity .6s .5s}
#score.on{opacity:1}
#score.bump{animation:sb .25s}
@keyframes sb{50%{transform:scale(1.22)}}
#combo{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 3vh + 21vmin);left:0;right:0;text-align:center;font-size:7vmin;color:#ffd23f;-webkit-text-stroke:1vmin var(--ink);paint-order:stroke fill;opacity:0;pointer-events:none;transition:opacity .25s}
#combo.on{opacity:1}
#combo.bump{animation:cb .3s}
@keyframes cb{from{transform:scale(1.7) rotate(-4deg)}}
#tip{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14vh);transform:translateX(-50%) scale(.8);opacity:0;transition:.3s;max-width:82vw;padding:1.6vh 5vw;font-size:4.5vmin;pointer-events:none}
#tip.on{opacity:1;transform:translateX(-50%) scale(1)}
#over{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);transform:translateX(-50%) rotate(-1deg);padding:2vh 6vw;font-size:7vmin;white-space:nowrap;pointer-events:none}
#over:not(.hide){animation:overIn .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes overIn{from{transform:translateX(-50%) translateY(30vh) rotate(-8deg) scale(.6);opacity:0}}
#over small{display:block;font-size:4.2vmin;margin-top:.8vh}
#overTxt{white-space:pre-line}
#home,#pz{position:fixed;z-index:3;left:4vw;top:calc(env(safe-area-inset-top,0px) + 2vh);padding:1vh 4vw;font-size:5vmin;cursor:pointer;background:var(--sun)}
#codeIn{flex:1;font-size:7.4vmin;text-transform:uppercase;min-width:0;outline:none}
#codeIn::placeholder{color:#1b1a3a66}
#roomInfo,#misInfo,#sknInfo,#helpInfo{flex:2.4;font-size:4.2vmin;white-space:pre-line;display:flex;align-items:center;justify-content:center;line-height:1.25;padding:0 2vw}
#misInfo,#helpInfo{font-size:3.3vmin;flex:4}
#sknInfo{font-size:3.7vmin;flex:3}
#rank{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 1.2vh);right:3vw;font-size:4.4vmin;color:#fff;-webkit-text-stroke:.7vmin var(--ink);paint-order:stroke fill;pointer-events:none}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg>div{position:absolute;will-change:transform,opacity}
#city{left:0;right:0;bottom:0;height:42vh;background-repeat:repeat-x;background-size:auto 100%;background-position:bottom}
#clouds{left:0;right:0;top:0;height:100vh;opacity:0}
.cl{position:absolute;width:34vmin;height:20vmin;background-size:contain;background-repeat:no-repeat;animation:drift 16s ease-in-out infinite alternate}
.cl:nth-child(even){animation-duration:23s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translateX(10vw)}}
#stars{left:0;right:0;top:-20vh;height:140vh;opacity:0;background-size:300px 300px;animation:twinkle 3s infinite alternate}
#shoot{position:absolute;top:30%;right:-25vmin;width:22vmin;height:.7vmin;border-radius:1vmin;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 6s linear infinite}
@keyframes shoot{0%,72%{opacity:0;transform:translate(0,0) rotate(-28deg)}75%{opacity:1}100%{opacity:0;transform:translate(-130vw,62vh) rotate(-28deg)}}
#moon{right:9vw;top:7vh;width:30vmin;height:30vmin;opacity:0;background-size:contain}
@keyframes twinkle{from{filter:brightness(.7)}to{filter:brightness(1.3)}}
#pop{position:fixed;z-index:4;left:0;right:0;top:24vh;text-align:center;pointer-events:none}
.pw{position:absolute;left:0;right:0;font-size:11vmin;color:#fff;-webkit-text-stroke:1.5vmin var(--ink);paint-order:stroke fill;text-shadow:.9vmin .9vmin 0 var(--ink);animation:pw .95s forwards}
@keyframes pw{0%{transform:scale(.3) rotate(-14deg);opacity:0}18%{transform:scale(1.25) rotate(-5deg);opacity:1}35%{transform:scale(1) rotate(-3deg)}75%{opacity:1}100%{transform:translateY(-9vh) rotate(-3deg);opacity:0}}
#rays{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,255,255,.75) 0 3deg,transparent 3deg 11deg);-webkit-mask-image:radial-gradient(circle at 50% 62%,transparent 28%,#000 75%);mask-image:radial-gradient(circle at 50% 62%,transparent 28%,#000 75%)}
#rays.on{animation:rays .5s ease-out}
@keyframes rays{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.5)}}
.hide{display:none!important}
@keyframes nkDrop{0%{transform:translateY(-260px);opacity:0}14%{transform:translateY(0);opacity:1}18%{transform:translateY(-10px)}22%,78%{transform:translateY(0);opacity:1}92%,100%{transform:translateY(0);opacity:0}}
.nk{animation:nkDrop 3.2s infinite}
@media(prefers-reduced-motion:reduce){.nk,.cl,#logo,#shoot{animation:none}}
#load{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:linear-gradient(#ff8fb8,#ffc2a8 55%,#fff0b8);transition:opacity .6s}
#load.gone{opacity:0;pointer-events:none}
#load svg{width:min(60vmin,420px);height:auto}
#ldTitle{font-size:11vmin;color:#fff;-webkit-text-stroke:1.4vmin var(--ink);paint-order:stroke fill;text-shadow:.8vmin .8vmin 0 var(--ink)}
#ldBar{width:58vmin;height:3.4vmin;border:.8vmin solid var(--ink);border-radius:2vmin;background:var(--paper);overflow:hidden}
#ldFill{height:100%;width:0;background:var(--pink);transition:width .35s;position:relative;overflow:hidden}
#ldFill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:ldShine 1.2s linear infinite}
@keyframes ldShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
#ldTxt{font-size:4.4vmin;text-align:center;padding:0 6vw}
#ldDev,#dev{bottom:calc(env(safe-area-inset-bottom,0px) + 2.5vh);left:0;right:0;text-align:center;font-size:3.6vmin;letter-spacing:.18em;color:#fff;-webkit-text-stroke:.6vmin var(--ink);paint-order:stroke fill;pointer-events:none}
#ldDev{position:absolute}
#dev{position:fixed;z-index:3;transition:opacity .5s}
#menu.out~#dev{opacity:0}
#pauseBox{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:2vh;width:56vw;max-width:380px}
#pauseBox>*{padding:1.6vh 0;font-size:6.4vmin;flex:none}
#pauseT{background:var(--sun)}
#fl{left:0;right:0;top:0;bottom:0}
#achInfo{flex:5;font-size:2.9vmin;white-space:pre-line;display:flex;align-items:center;justify-content:center;line-height:1.25;padding:0 2vw}
#fl i{position:absolute;bottom:-3vh;background:#fff;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.85}90%{opacity:.6}to{transform:translateY(-108vh) rotate(200deg);opacity:0}}
@media(prefers-reduced-motion:reduce){#fl i{animation:none}}
#bkIn{flex:1;font-size:4vmin;min-width:0;outline:none}
#helpInfo{font-size:2.8vmin;flex:5}
#misInfo{font-size:2.9vmin;flex:5}
#achInfo{font-size:2.6vmin}
#tmr{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 1.2vh);right:3vw;font-size:7vmin;color:#fff;-webkit-text-stroke:.9vmin var(--ink);paint-order:stroke fill;pointer-events:none}
#nov{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:72vw;max-width:480px;padding:2.5vh 4vw;display:flex;flex-direction:column;gap:2vh}
#novT{white-space:pre-line;font-size:4.2vmin;line-height:1.3;text-align:left}
#nov .btn{flex:none;padding:1.2vh 0;font-size:6vmin;background:var(--pink)}
#snow{left:0;right:0;top:0;bottom:0;opacity:0}
#snow i{position:absolute;top:-4vh;background:#fff;border-radius:50%;animation:fall linear infinite}
@keyframes fall{to{transform:translate(4vw,108vh)}}
@media(prefers-reduced-motion:reduce){#snow i{animation:none}}
#rankInfo,#amigInfo{flex:5;font-size:2.8vmin;white-space:pre-line;display:flex;align-items:center;justify-content:center;line-height:1.3;padding:0 2vw}
#nickIn,#frIn{flex:1;font-size:4.4vmin;min-width:0;outline:none}
</style>

<div id="load"><div id="ldSvg"></div><div id="ldTitle">NEKO TOWER</div><div id="ldBar"><div id="ldFill"></div></div><div id="ldTxt">Carregando...</div><div id="ldDev">desenvolvido por N E K</div><button id="ldRetry" class="box btn hide" style="flex:none;padding:1vh 6vw" onclick="location.reload()">Tentar de novo</button></div>
<script>
// Torre da tela de carregamento (gerada por código, mais leve)
(function(){
  const I='#1b1a3a',f=(p,hu,l,s)=>`<polygon points="${p.join(' ')}" fill="hsl(${hu},${s}%,${l}%)" stroke="${I}" stroke-width="6" stroke-linejoin="round"/>`;
  let g='<ellipse cx="200" cy="382" rx="130" ry="22" fill="#1b1a3a" fill-opacity=".25"/>',cy=300;
  [[110,262],[95,300],[80,335],[66,10]].forEach(([w,hu],i)=>{
    const ty=cy-w/2,h=34,T=[[200,ty],[200+w,ty+w/2],[200,ty+w],[200-w,ty+w/2]],L=[[200-w,ty+w/2],[200,ty+w],[200,ty+w+h],[200-w,ty+w/2+h]],R=[[200,ty+w],[200+w,ty+w/2],[200+w,ty+w/2+h],[200,ty+w+h]];
    let x='';
    if(i===3)x=`<polygon points="${200-w+8},${ty+w/2} ${200-w+10},${ty-34} ${200-w+44},${ty+w/2-14}" fill="hsl(10,80%,80%)" stroke="${I}" stroke-width="6" stroke-linejoin="round"/><polygon points="${200+w-8},${ty+w/2} ${200+w-10},${ty-34} ${200+w-44},${ty+w/2-14}" fill="hsl(10,80%,80%)" stroke="${I}" stroke-width="6" stroke-linejoin="round"/><ellipse cx="${200-w*.45}" cy="${ty+w*.75+h*.3}" rx="9" ry="14" fill="${I}"/><ellipse cx="${200+w*.45}" cy="${ty+w*.75+h*.3}" rx="9" ry="14" fill="${I}"/>`;
    g+=`<g class="nk" style="animation-delay:${i*.45}s">${f(L,hu,64,65)}${f(R,hu,52,60)}${f(T,hu,80,80)}${x}</g>`;cy-=h;
  });
  document.getElementById('ldSvg').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">'+g+'</svg>';
})();
// Progresso REAL: cada parte só conta quando de fato terminou
const Load=(()=>{
  const nomes={motor:'motor 3D',fonte:'fonte do menu',cena:'cena e shaders',imagem:'primeira imagem'};
  const feitos=new Set(),g=id=>document.getElementById(id),total=4,MIN_MS=2500;
  function ui(){const falta=Object.keys(nomes).filter(k=>!feitos.has(k));g('ldFill').style.width=(feitos.size/total*100)+'%';g('ldTxt').textContent=falta.length?'Carregando '+nomes[falta[0]]+' ('+feitos.size+' de '+total+' partes prontas)':'Tudo pronto!';}
  return{
    done(k){feitos.add(k);ui();if(feitos.size===total)setTimeout(()=>{g('load').classList.add('gone');setTimeout(()=>g('load').remove(),700)},Math.max(150,MIN_MS-performance.now()));},
    fail(m){g('ldTxt').textContent=m;g('ldRetry').classList.remove('hide');g('ldFill').style.background='#e0405a';},ui
  };
})();
Load.ui();
</script>

<script>

<script>
const GAME_V=6; // aumente a cada versão nova
const $=id=>document.getElementById(id);
const H=.5,BASE=3,LIM=3,TOL=.07,MENU_SHIFT=.4,VIEW=2.5;

// ---- Salvamento e opções (guardados no aparelho) ----
const SAVE_KEY='nekoTowerSave';
let sv={moedas:0,donos:[0],skin:0,dia:'',ids:[],prog:{},pegas:{},tips:{},opt:null,ach:{},st:{perf:0,jogos:0,score:0,combo:0}};
try{Object.assign(sv,JSON.parse(localStorage.getItem(SAVE_KEY))||{});}catch(e){}
const salvar=()=>{try{localStorage.setItem(SAVE_KEY,JSON.stringify(sv));}catch(e){}};
const cfg={som:true,mus:true,vib:true,gfx:1};
if(sv.opt)Object.assign(cfg,sv.opt);
const saveOpt=()=>{sv.opt={som:cfg.som,mus:cfg.mus,vib:cfg.vib,gfx:cfg.gfx};salvar();};
let best=0;try{best=+localStorage.getItem('stackBest')||0;}catch(e){}
const vib=p=>{if(cfg.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};

// ---- Motor Babylon ----
const eng=new BABYLON.Engine($('c'),true,{alpha:true,antialias:true});
const scene=new BABYLON.Scene(eng);
scene.clearColor=new BABYLON.Color4(0,0,0,0);
scene.skipPointerMovePicking=true;scene.autoClear=true;
const RIG=new BABYLON.Vector3(14,19.8,-14);
const cm=new BABYLON.FreeCamera('cm',RIG.clone(),scene);
cm.setTarget(BABYLON.Vector3.Zero());cm.mode=BABYLON.Camera.ORTHOGRAPHIC_CAMERA;cm.minZ=.1;cm.maxZ=100;

// Shader toon: 3 faixas de luz, hachura e uma "pele" para cada skin (0 a 7) + brilho de frenesi
BABYLON.Effect.ShadersStore.toonVertexShader=`precision highp float;attribute vec3 position;attribute vec3 normal;attribute vec4 color;uniform mat4 world;uniform mat4 worldViewProjection;varying vec3 vN;varying vec4 vC;varying vec3 vP;
void main(){vN=normalize((world*vec4(normal,0.)).xyz);vC=color;vP=position;gl_Position=worldViewProjection*vec4(position,1.);}`;
BABYLON.Effect.ShadersStore.toonFragmentShader=`precision highp float;varying vec3 vN;varying vec4 vC;varying vec3 vP;uniform vec3 L;uniform float hatch;uniform float skin;uniform float time;uniform float fever;
void main(){
  float d=dot(normalize(vN),normalize(L));

let ac;
function beep(f,d){
  if(!cfg.som)return;
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

// ---- Música de fundo: pad suave + notas de pentatônica, com reverb e filtro (volume baixo, sem estourar) ----
const ESC=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.66]; // escala dos encaixes perfeitos
const PROG=[
  {ch:[[130.81,164.81,196,246.94],[110,130.81,164.81,196],[87.31,110,130.81,164.81],[98,123.47,146.83,164.81]],es:[261.63,293.66,329.63,392,440,523.25,587.33,659.25]},
  {ch:[[146.83,174.61,220,261.63],[116.54,146.83,174.61,220],[98,116.54,146.83,174.61],[110,146.83,164.81,196]],es:[293.66,349.23,440,523.25,587.33,698.46]},
  {ch:[[164.81,196,246.94,293.66],[130.81,164.81,196,293.66],[110,130.81,164.81,246.94],[146.83,196,220,329.63]],es:[329.63,392,493.88,587.33,659.25,783.99]}
];
const Mus={g:null,bus:null,lp:null,tm:null,t:0,i:0,
  init(){
    if(this.g||!ac)return;const c=ac;
    this.g=c.createGain();this.g.gain.value=0;
    const cp=c.createDynamicsCompressor();cp.threshold.value=-26;cp.ratio.value=6;cp.attack.value=.02;cp.release.value=.4;
    this.bus=c.createGain();this.lp=c.createBiquadFilter();this.lp.type='lowpass';this.lp.frequency.value=1100;this.lp.Q.value=.2;
    const len=c.sampleRate*3,buf=c.createBuffer(2,len,c.sampleRate);
    for(let k=0;k<2;k++){const d=buf.getChannelData(k);for(let n=0;n<len;n++)d[n]=(Math.random()*2-1)*Math.pow(1-n/len,3);}
    const cv=c.createConvolver();cv.buffer=buf;const wet=c.createGain(),dry=c.createGain();wet.gain.value=.55;dry.gain.value=.7;
    this.bus.connect(this.lp);this.lp.connect(dry);dry.connect(this.g);this.lp.connect(cv);cv.connect(wet);wet.connect(this.g);
    this.g.connect(cp);cp.connect(c.destination);
  },
  nota(f,t,dur,tipo,vol,att){
    const o=ac.createOscillator(),e=ac.createGain();o.type=tipo;o.frequency.value=f;
    e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(vol,t+att);e.gain.linearRampToValueAtTime(0,t+dur);
    o.connect(e);e.connect(this.bus);o.start(t);o.stop(t+dur+.05);
  },
  compasso(){
    const P=PROG[this.fase||0],CH=P.ch,ES=P.es,t=this.t;
    CH[this.i++%4].forEach(f=>{this.nota(f,t,9.5,'sine',.05,2.5);this.nota(f*1.004,t+.1,9.5,'sine',.03,3);});
    let x=t+1.2;
    for(let n=0;n<5;n++){if(Math.random()<.8){const f=ES[Math.random()*ES.length|0];this.nota(f,x,2.8,'sine',.05,.03);this.nota(f*2,x,1.2,'sine',.012,.03);}x+=1.2+Math.random()*.9;}
    this.t+=8;
  },
  start(){
    if(!cfg.mus)return;
    try{
      ac=ac||new(window.AudioContext||window.webkitAudioContext)();this.init();
      if(ac.state==='suspended')ac.resume();
      this.g.gain.cancelScheduledValues(ac.currentTime);this.g.gain.setTargetAtTime(.3,ac.currentTime,1.5);
      if(!this.tm){this.t=ac.currentTime+.2;this.tm=setInterval(()=>{if(ac.state!=='running')return;if(this.t<ac.currentTime)this.t=ac.currentTime+.1;while(this.t<ac.currentTime+4)this.compasso();},800);}
    }catch(e){}
  },
  stop(){if(!this.g)return;this.g.gain.setTargetAtTime(0,ac.currentTime,.5);clearInterval(this.tm);this.tm=null;},
  mood(p){if(this.lp)this.lp.frequency.setTargetAtTime(p?1900:1100,ac.currentTime,1.2);}
};

function spawn(){

  const boss=n%25===0&&modo!=='zen',base=modo==='zen'?2.6:Math.min(2.5+n*.06,5.5);

function cull(){const lo=stack.length*H-15;stack.forEach((b,i)=>b.mesh.setEnabled(i*H>=lo));}

function place(){
  const sk=SK[skinI],top=stack[stack.length-1],m=mv,a=m.axis,sz=a==='x'?'w':'d';
  const d=m[a]-top[a],lvl=stack.length*H,nb={x:m.x,z:m.z,w:m.w,d:m.d,hue:m.hue};
  let perfect=false;
  if(Math.abs(d)<=TOL*(sk.tol||1)){
    perfect=true;nb[a]=top[a];combo++;runPerf++;runBonus+=sk.pp||0;sv.st.perf++;sv.st.combo=Math.max(sv.st.combo,combo);if(m.boss){runBonus+=15;popText('Chefe derrotado! +15 🪙',1,7,16);}if(modo==='relogio')tmpR=Math.min(tmpR+2,99);
    if(combo>=(sk.cres||4)&&nb[sz]<BASE){const g=Math.min(.12,BASE-nb[sz]);nb[sz]+=g;nb[a]-=g/2;}
    beep(ESC[Math.min(combo-1,11)],.32);vib(combo>=5?[10,25,10]:12);
    comboFx(combo);mood=1+.1*Math.min(combo,6);punch=1;
    tip('t3','🎯 Encaixe perfeito! Combos dão moedas e fazem o bloco crescer');
    if(combo===5)tip('t4','🔥 Frenesi! O bloco brilha. Não deixe o combo cair!');
  }else{
    combo=0;
    if(Math.abs(d)>=m[sz]){m.mesh.dispose();fall(m.x,m.z,m.w,m.d,lvl,m.hue);if(modo==='zen'||modo==='relogio'){combo=0;hud();mood=.75;shake=.2;vib(25);beep(220,.15);if(modo==='relogio')tmpR=Math.max(0,tmpR-3);popText('Tente de novo!',2,7,8);spawn();return;}mv=null;return gameOver();}
    const cut=Math.abs(d),f={x:m.x,z:m.z,w:m.w,d:m.d};
    nb[sz]=m[sz]-cut;
    if(d>0){f[a]=m[a]+nb[sz];f[sz]=cut;}else{nb[a]=top[a];f[sz]=cut;}
    fall(f.x,f.z,f.w,f.d,lvl,m.hue);
    beep(220,.15);vib(28);mood=.75;shake=.28;

  }
  m.mesh.dispose();
  nb.mesh=mk(nb.x,nb.z,nb.w,nb.d,lvl,nb.hue);

    const cx=nb.x+nb.w/2,cz=nb.z+nb.d/2,c=skinColor(stack.length,nb.hue);
    burst(cx,lvl+H,cz,nb.w,nb.d,(Math.min(10+combo*5,60)*(cfg.gfx?1:.5))|0,c);

  onScore();cull();
}

const POOL=[

const hojeKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function sorteia(k){
  let n=0;for(const ch of k)n=(n*31+ch.charCodeAt(0))>>>0;
  const ids=POOL.map((_,i)=>i),out=[];
  while(out.length<3){out.push(ids.splice(n%ids.length,1)[0]);n=Math.floor(n/7)+3;}
  return out;
}
const Mis={
  ativas(){const k=hojeKey();if(sv.dia!==k){sv.dia=k;sv.ids=sorteia(k);sv.prog={};sv.pegas={};salvar();}return sv.ids.map(i=>POOL[i]);},
  add(c,v){this.upd(c,(sv.prog[c]||0)+v);semUpd(c,v,false);},
  max(c,v){if(v>(sv.prog[c]||0))this.upd(c,v);semUpd(c,v,true);},

};

  $('misInfo').textContent+='\n\nDa semana:\n'+SEM.map(m=>(sv.sg[m.id]?'✔ ':'• ')+m.txt+' ('+Math.min(sv.sp[m.chave]||0,m.meta)+'/'+m.meta+') +'+m.premio+'🪙').join('\n');
  $('bauB').textContent=sv.bau===hojeKey()?'🎁 Baú (amanhã)':'🎁 Baú diário';
}
$('bauB').onclick=()=>{
  const k=hojeKey();if(sv.bau===k)return popText('Volte amanhã!',2,7,8);
  sv.bau=k;const livres=SK.map((_,i)=>i).filter(i=>!sv.donos.includes(i));
  if(Math.random()<.1&&livres.length){const i=livres[Math.random()*livres.length|0];sv.donos.push(i);popText('🎁 Skin: '+SK[i].nome+'!',1,8,10);}
  else{const c=20+(Math.random()*61|0);sv.moedas+=c;popText('🎁 +'+c+' 🪙',1,10,10);}
  beep(660,.3);vib([15,30,15]);salvar();ach();renderMis();
};
$('gachaB').onclick=()=>{
  if(sv.moedas<120)return popText('Faltam '+(120-sv.moedas)+' moedas',2,7,8);
  const livres=SK.map((_,i)=>i).filter(i=>!sv.donos.includes(i)&&SK[i].preco<=250);
  sv.moedas-=120;
  if(livres.length){const i=livres[Math.random()*livres.length|0];sv.donos.push(i);popText('🎰 '+SK[i].nome+'!',1,10,10);}
  else{sv.moedas+=60;popText('Já tem as comuns! +60 🪙',1,7,10);}
  beep(784,.3);vib([15,30,15]);salvar();ach();renderSkn();
};
// ================= Conquistas =================
const ACH=[
  ['b10','Chegue a 10 blocos',()=>sv.st.score,10,10],['b25','Chegue a 25 blocos',()=>sv.st.score,25,25],
  ['b50','Chegue a 50 blocos',()=>sv.st.score,50,60],['b100','Chegue a 100 blocos',()=>sv.st.score,100,150],
  ['c5','Combo de 5 seguidos',()=>sv.st.combo,5,30],['c10','Combo de 10 seguidos',()=>sv.st.combo,10,80],
  ['p50','50 encaixes perfeitos',()=>sv.st.perf,50,40],['p250','250 encaixes perfeitos',()=>sv.st.perf,250,120],
  ['j20','Jogue 20 partidas',()=>sv.st.jogos,20,30],['sk3','Tenha 3 skins',()=>sv.donos.length,3,50],
  ['d7','7 dias seguidos',()=>sv.streak||0,7,100]
];
function ach(){ACH.forEach(([id,t,g,m,p])=>{if(!sv.ach[id]&&g()>=m){sv.ach[id]=1;sv.moedas+=p;salvar();popText('🏆 '+t+' +'+p,1,6,18);vib([15,30,15]);}});}
function renderAch(){
  const n=ACH.filter(a=>sv.ach[a[0]]).length;
  $('achInfo').textContent='Nv '+niv()+' · '+TIT[Math.min(niv()-1,TIT.length-1)]+' ('+(sv.xp||0)+' XP)\nPartidas '+sv.st.jogos+' · Perfeitos '+sv.st.perf+' · Combo '+sv.st.combo+' · '+Math.round((sv.st.tempo||0)/60)+' min\n🏆 '+n+'/'+ACH.length+' conquistas\n\n'+ACH.map(([id,t,g,m,p])=>(sv.ach[id]?'✔ ':'• ')+t+(sv.ach[id]?'':' ('+Math.min(g(),m)+'/'+m+')')+' +'+p+'🪙').join('\n');
}
$('achB').onclick=()=>{showGrp('ach');renderAch();};
$('achBack').onclick=()=>{showGrp('mis');renderMis();};
// ================= Telas de Skins e Ajuda =================
let prev=sv.skin;
function renderSkn(){
  const s=SK[prev],dono=sv.donos.includes(prev);
  $('sknInfo').textContent='🪙 '+sv.moedas+'\n'+s.nome+'\n'+s.bonus+'\n'+(prev===sv.skin?'Equipada':dono?'Você já tem':'Preço: '+s.preco+' moedas');
  $('sknBuy').textContent=prev===sv.skin?'Equipada':dono?'Equipar':'Comprar';
  $('sknNext').textContent='Próxima ('+(prev+1)+'/'+SK.length+')';
}
const AJUDA='👆 Toque para soltar o bloco\n🎯 Alinhado = encaixe perfeito (combo)\n✂️ O que passa da torre é cortado\n🔥 5 combos seguidos = Frenesi\n🪙 Moedas compram skins com bônus\n📅 Missões novas todo dia';
$('misBtn').onclick=()=>{showGrp('mis');renderMis();};
$('misBack').onclick=()=>showGrp('main');
$('sknBtn').onclick=()=>{prev=sv.skin;showGrp('skn');renderSkn();};
$('sknNext').onclick=()=>{prev=(prev+1)%SK.length;setSkin(prev);renderSkn();};
$('sknBuy').onclick=()=>{
  const s=SK[prev];if(prev===sv.skin)return;
  if(!sv.donos.includes(prev)){
    if(sv.moedas<s.preco)return popText('Faltam '+(s.preco-sv.moedas)+' moedas',2,7,8);
    sv.moedas-=s.preco;sv.donos.push(prev);beep(660,.2);vib(25);ach();
  }
  sv.skin=prev;salvar();renderSkn();
};
$('sknBack').onclick=()=>{if(skinI!==sv.skin)setSkin(sv.skin);prev=sv.skin;showGrp('main');};
$('helpB').onclick=()=>{let m='';try{m=parent.__otaMsg||''}catch(e){}$('helpInfo').textContent=AJUDA+'\n🌿 Zen: sem game over\n⏱ Relógio: 60s, perfeito dá +2s\n📅 Diário: mesma torre pra todos\n\nVersão '+GAME_V+(m?' · '+m:'');showGrp('help');};
$('helpBack').onclick=()=>showGrp('conf');
$('bkOut').onclick=()=>{try{const c=btoa(unescape(encodeURIComponent(JSON.stringify(sv))));$('bkIn').value=c;$('bkIn').select();let ok=false;try{navigator.clipboard.writeText(c);ok=true;}catch(e){}popText(ok?'Backup copiado!':'Copie o código do campo',1,6,10);}catch(e){popText('Erro no backup',2,6,10);}};
$('bkRes').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('bkIn').value.trim()))));if(!o||typeof o.moedas!=='number'||!Array.isArray(o.donos))throw 0;Object.assign(sv,o);salvar();popText('Restaurado! Reiniciando...',1,6,10);setTimeout(()=>location.reload(),1200);}catch(e){popText('Código inválido',2,6,10);}};
$('novOk').onclick=()=>$('nov').classList.add('hide');

// ---- Online: salas por código (recurso "room" do claude.ai). Vence quem sobrevive mais tempo ----
const net={api:null,room:null,code:'',host:false,ready:false,active:false,done:false,lastGo:0,t0:0,unsub:null,nick:'Jogador'+(100+Math.random()*900|0)};
(async()=>{try{net.api=await claude.use('room');}catch(e){}if(!net.api)$('onlBtn').textContent='Ranking';})();
const setStatus=t=>{$('bestTxt').textContent=t;};
const idleStatus=()=>setStatus(best||sv.moedas?'Nv '+niv()+' · Melhor '+best+' · 🪙 '+sv.moedas:'empilhe tudo!');
const showGrp=id=>{['main','conf','onl','lobby','mis','skn','help','ach','modos','rank','amigos'].forEach(g=>$(g).classList.toggle('hide',g!==id));if(id==='main')idleStatus();};
async function joinRoom(code,host){
  if(!net.api)return setStatus('Online indisponível aqui');
  setStatus('Entrando...');
  try{net.room=await net.api.join('stk-'+code.toLowerCase());}catch(e){return setStatus('Não foi possível entrar');}
  Object.assign(net,{code:code.toUpperCase(),host,ready:host,active:false,done:false,lastGo:0});
  net.unsub=net.room.onPeers(onNet);
  await net.room.presence({n:net.nick,host,go:null,rd:null,alive:false,t:0,sc:0});
  showGrp('lobby');$('start').classList.toggle('hide',!host);idleStatus();renderLobby();
  if(!host)setTimeout(async()=>{
    const h=net.room&&net.room.peers().find(p=>p.presence.host);
    if(net.room&&!h){await leaveRoom();setStatus('Sala não encontrada');}
    else if(h){net.lastGo=h.presence.go||0;net.ready=true;}
  },2500);
}
async function leaveRoom(){
  try{net.unsub&&net.unsub();net.room&&await net.room.leave();}catch(e){}
  net.room=null;net.active=false;showGrp('onl');idleStatus();
}
function renderLobby(){
  const ps=net.room.peers().slice(0,6);
  $('roomInfo').textContent='Sala '+net.code+'\n'+ps.map(p=>(p.presence.host?'★ ':'')+(p.presence.n||'?')+(p.isMe?' (você)':'')).join('\n');
}
function onNet(){
  if(!net.room)return;renderLobby();
  const h=net.room.peers().find(p=>p.presence.host);
  if(net.ready&&h&&h.presence.go&&h.presence.go!==net.lastGo&&(!net.active||net.done))startOnline(h.presence.go);
  if(net.active)renderRank();
}
function startOnline(go){
  net.lastGo=go;net.active=true;net.done=false;modo='classico';
  net.room.presence({rd:go,alive:true,t:0,sc:0});
  $('over').classList.add('hide');reset();
  mode='pan';panT0=performance.now();beep(523,.2);
  $('menu').classList.add('out');$('score').classList.add('on');$('rank').classList.remove('hide');
}
function renderRank(){
  const ps=net.room.peers().filter(p=>p.presence.rd===net.lastGo);
  const vivos=ps.filter(p=>p.presence.alive).length;
  $('rank').textContent='Vivos: '+vivos+'/'+ps.length;
  net.done=ps.length>0&&vivos===0;
  if(mode!=='over')return;
  const rows=ps.slice().sort((a,b)=>(b.presence.alive?1e9:b.presence.t)-(a.presence.alive?1e9:a.presence.t));
  $('overTxt').textContent=rows.map((p,i)=>(i+1)+'º '+(p.presence.n||'?')+(p.isMe?' (você)':'')+(p.presence.alive?' - jogando':' - '+(+p.presence.t).toFixed(1)+'s | '+p.presence.sc+' blocos')).join('\n')+(net.done?'\nToque para voltar à sala':'');
}
function backToLobby(){
  net.active=false;net.done=false;net.room.presence({rd:null,alive:false});
  $('over').classList.add('hide');$('rank').classList.add('hide');$('score').classList.remove('on');
  $('menu').classList.remove('out');showGrp('lobby');
  reset();mode='menu';shift=MENU_SHIFT;zoom=1;
}
$('onlBtn').onclick=()=>{if(!net.api)return abreRank();showGrp('onl');};
$('onlBack').onclick=()=>{showGrp('main');};
$('mk').onclick=()=>{const c=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');joinRoom(c,true);};
$('jn').onclick=()=>{const c=$('codeIn').value.trim().toUpperCase();if(c.length>=4)joinRoom(c,false);};
$('start').onclick=()=>net.room&&net.room.presence({go:Date.now()});
$('leave').onclick=leaveRoom;

// ---- Botões do menu ----
$('play').onclick=()=>{if(mode!=='menu')return;$('mDia').textContent=sv.diaD===hojeKey()?'Diário ✔':'Desafio diário';showGrp('modos');};
$('mBack').onclick=()=>showGrp('main');
function hashDia(){let n=0;for(const c of hojeKey())n=(n*31+c.charCodeAt(0))>>>0;return n%360;}
function iniciar(m){
  if(mode!=='menu')return;modo=m;reset();
  mode='pan';panT0=performance.now();beep(523,.2);
  $('menu').classList.add('out');$('score').classList.add('on');
  const T={zen:['mz','🌿 Zen: sem game over e sem pressa. Se errar, tente de novo!'],relogio:['mr','⏱ Relógio: 60s! Perfeito dá +2s, errar tira 3s'],diario:['md','📅 Desafio diário: chegue a 20 blocos e ganhe 60 🪙. A torre é a mesma pra todos!']}[m];
  if(T)setTimeout(()=>tip(T[0],T[1]),1300);
}
$('mClas').onclick=()=>iniciar('classico');$('mZen').onclick=()=>iniciar('zen');$('mRel').onclick=()=>iniciar('relogio');$('mDia').onclick=()=>iniciar('diario');
$('cfg').onclick=()=>showGrp('conf');
$('back').onclick=()=>showGrp('main');
const AUD=[[1,1,'Tudo'],[0,1,'Só música'],[1,0,'Só efeitos'],[0,0,'Mudo']];
const audI=()=>Math.max(0,AUD.findIndex(a=>!!a[0]===cfg.som&&!!a[1]===cfg.mus));
$('snd').onclick=()=>{const i=(audI()+1)%4;cfg.som=!!AUD[i][0];cfg.mus=!!AUD[i][1];$('snd').textContent='Áudio: '+AUD[i][2];saveOpt();cfg.mus?Mus.start():Mus.stop();beep(660,.15);};
$('vibB').onclick=e=>{cfg.vib=!cfg.vib;e.target.textContent='Vibração: '+(cfg.vib?'Ligada':'Desligada');saveOpt();vib(30);};
$('gfx').onclick=()=>{cfg.gfx=(cfg.gfx+1)%3;applyGfx();saveOpt();setStatus(Q().desc);setTimeout(idleStatus,3500);};
$('snd').textContent='Áudio: '+AUD[audI()][2];
$('vibB').textContent='Vibração: '+(cfg.vib?'Ligada':'Desligada');
idleStatus();

const arranca=()=>{if(!cfg.mus)return;Mus.start();if(ac&&ac.state==='running')removeEventListener('pointerup',arranca);};
addEventListener('pointerup',arranca);
document.addEventListener('visibilitychange',()=>{if(!ac)return;document.hidden?ac.suspend():ac.resume();});
addEventListener('message',e=>{if(e.data&&e.data.ota)popText(e.data.ota,1,5,12);});
(()=>{const sn=$('snow');for(let i=0;i<30;i++){const e=document.createElement('i'),z=3+Math.random()*5;e.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(6+Math.random()*7)+'s;animation-delay:-'+Math.random()*12+'s';sn.appendChild(e);}})();
(()=>{const f=$('fl');for(let i=0;i<16;i++){const e=document.createElement('i'),z=3+Math.random()*6;e.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(10+Math.random()*10)+'s;animation-delay:-'+Math.random()*16+'s';f.appendChild(e);}})();
// Bônus diário com sequência de dias (até 7)
const NOV='• Ranking global online (precisa de internet)\n• Apelido e código de amigo pra comparar recordes\n• Seus dados continuam salvos no aparelho';
setTimeout(()=>Rank.sync(),7000);
setTimeout(()=>{if(sv.ver!==GAME_V&&(sv.ver||sv.st.jogos>0)){$('novT').textContent='✨ Versão '+GAME_V+'\n'+NOV;$('nov').classList.remove('hide');}sv.ver=GAME_V;salvar();},4500);
(()=>{const k=hojeKey();if(sv.login===k)return;const y=new Date();y.setDate(y.getDate()-1);const yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  sv.streak=sv.login===yk?(sv.streak||0)+1:1;sv.login=k;const b=10*Math.min(sv.streak,7);sv.moedas+=b;salvar();
  setTimeout(()=>{popText('Bônus diário +'+b+' 🪙',1,7,10);popText('Dias seguidos: '+sv.streak,0,5,22);idleStatus();ach();},4200);})();
// ---- Loop principal ----
reset();
scene.executeWhenReady(()=>Load.done('cena'));
let frames=0,fpsT=0,fpsN=0;
eng.runRenderLoop(()=>{
  const dt=paused?0:Math.min(eng.getDeltaTime()/1000,.05),now=performance.now()/1000;
  const pl=mode==='play'&&!net.active&&!paused;if(pl!==plAnt){plAnt=pl;$('pz').classList.toggle('hide',!pl);Mus.mood(pl);}
  if(mode==='play'&&!paused){sv.st.tempo=(sv.st.tempo||0)+dt;if(modo==='relogio'){tmpR-=dt;if(tmpR<=0){tmpR=0;if(mv){mv.mesh.dispose();mv=null;}gameOver();}}}
  const tv=modo==='relogio'&&(mode==='play'||mode==='pan');if(tv!==tmrAnt){tmrAnt=tv;$('tmr').classList.toggle('hide',!tv);}
  if(tv){const ts=Math.ceil(tmpR);if(ts!==tsAnt){tsAnt=ts;$('tmr').textContent='⏱ '+ts;}}

  if(mode==='pan'){
    const p=Math.min((performance.now()-panT0)/1000,1),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    shift=MENU_SHIFT*(1-e);zoom=1.18-.18*e;
    if(p>=1){mode='play';if(net.active)net.t0=performance.now();tip('t1','👆 Toque na tela para soltar o bloco!');}
  }
  if(mv&&(mode==='menu'||mode==='pan'||mode==='play')){
    mv[mv.axis]+=mv.dir*mv.speed*dt;
    if(mv[mv.axis]>LIM){mv[mv.axis]=LIM;mv.dir=-1;}
    if(mv[mv.axis]<-LIM){mv[mv.axis]=-LIM;mv.dir=1;}
    mv.mesh.position.x=mv.x+mv.w/2;mv.mesh.position.z=mv.z+mv.d/2;
    const c=mv.mesh.cat;
    if(c){const bl=now%3.4<.13;c.eyes.forEach(e=>e.scaling.y=e._by*mood*(bl?.12:1));c.ears.forEach((e,i)=>e.rotation.z=Math.sin(now*5+i*2)*.1);}
    if(mode==='menu'){mv.mesh.rotation.z=Math.sin(now*3)*.07;mv.mesh.scaling.y=1+Math.sin(now*6)*.05;}else if(mv.mesh.rotation.z){mv.mesh.rotation.z=0;mv.mesh.scaling.y=1;}
  }
  debris.forEach(b=>{b.vy+=14*dt;b.mesh.position.y-=b.vy*dt;});
  debris=debris.filter(b=>b.mesh.position.y>camY-12||(b.mesh.dispose(),false));
  if(popM&&!popM.isDisposed()){const p=Math.max(pop,0);popM.scaling.set(1+.12*p,1-.2*p,1+.12*p);pop-=dt*4;if(pop<=0){popM.scaling.set(1,1,1);popM=null;}}
  if(ringT>0){ringT-=dt*2.2;const k=1-Math.max(ringT,0),s=ringB*(1+k*1.3);ring.scaling.set(s,1,s);rm.alpha=Math.max(ringT,0)*.9;if(ringT<=0)ring.isVisible=false;}
  mood+=(1-mood)*Math.min(dt*.6,1);
  fev+=((combo>=5?1:0)-fev)*Math.min(dt*3,1);
  toon.setFloat('time',now%600);toon.setFloat('fever',fev);

  // Câmera: sobe com a torre; no fim de jogo afasta para mostrar a torre inteira
  const asp=eng.getRenderWidth()/eng.getRenderHeight(),hh0=Math.max(3.4,VIEW/asp)*zoom,ov=mode==='over'&&stack.length>=12;
  overK+=((ov?Math.max(1,(stack.length*H*.42+1.5)/hh0):1)-overK)*Math.min(dt*2.5,1);
  const hh=hh0*overK*(1-.035*Math.max(punch,0)),hw=hh*asp;
  camY+=((ov?stack.length*H/2-.34*hh:stack.length*H)-camY)*Math.min(dt*5,1);
  cm.position.set(RIG.x,RIG.y+camY,RIG.z);
  scenery(ov?stack.length:camY/H);
  const sw=Math.sin(now*.8)*Math.min(score/60,1)*.1,sx=(Math.random()-.5)*shake+sw,sy=(Math.random()-.5)*shake;
  shake=Math.max(0,shake-dt*1.5);punch-=dt*5;
  cm.orthoTop=hh*1.24+sy;cm.orthoBottom=-hh*.76+sy;
  cm.orthoLeft=-hw-shift*hw+sx;cm.orthoRight=hw-shift*hw+sx;
  scene.render();
  if(frames<2&&++frames===2){Load.done('imagem');try{localStorage.setItem('nekoTry',0)}catch(e){}}
  // Auto-otimização: se o celular engasgar, baixa o gráfico sozinho
  if(mode==='play'&&frames>=2){fpsT+=dt;if(++fpsN>=150){if(fpsT/fpsN>.036&&cfg.gfx>0){cfg.gfx--;applyGfx();saveOpt();popText('Gráfico reduzido p/ ficar liso',2,6,12);}fpsT=fpsN=0;}}
});
addEventListener('resize',()=>eng.resize());
</script>
